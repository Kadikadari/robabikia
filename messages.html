<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرسائل - روبابيكيا</title>
    
    <!-- Vercel Web Analytics -->
    <script defer src="https://cdn.vercel-insights.com/v1/script.js"></script>

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .logo-gradient { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .chat-container { height: calc(100vh - 120px); }
        @media (max-width: 768px) { .chat-container { height: calc(100vh - 80px); } }
        .msg-bubble { max-width: 85%; word-wrap: break-word; }
        .conv-item { transition: all 0.2s; -webkit-user-select: none; user-select: none; }
        .conv-item:active { background-color: #f1f5f9; transform: scale(0.98); }
        .unread-dot { width: 10px; height: 10px; background-color: #2563eb; border-radius: 50%; border: 2px solid white; }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-hidden">

    <header id="main-header" class="bg-white p-4 border-b shadow-sm z-50">
        <div class="container mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <div class="logo-gradient text-white w-9 h-9 flex items-center justify-center rounded-xl font-black text-lg">ر</div>
                <span class="text-lg font-black tracking-tighter">روبا<span class="text-blue-600">بيكيا</span></span>
            </a>
            <div id="current-user-avatar" class="w-9 h-9 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center font-black text-xs border border-white shadow-sm">؟</div>
        </div>
    </header>

    <main class="flex-1 container mx-auto p-0 md:p-4 text-right">
        <div class="bg-white md:rounded-3xl shadow-2xl border border-gray-100 flex overflow-hidden chat-container">

            <!-- Conversations List -->
            <div id="conv-list" class="w-full md:w-96 border-l border-gray-100 flex flex-col bg-gray-50/30">
                <div class="p-6 bg-white border-b flex justify-between items-center">
                    <h2 class="text-xl font-black text-gray-800">الرسائل</h2>
                    <span class="text-[10px] text-gray-400 font-bold italic">اضغط مطولاً للحذف</span>
                </div>
                <div id="conversations-container" class="flex-1 overflow-y-auto no-scrollbar">
                    <div class="p-10 text-center text-gray-400 text-xs font-bold italic">جاري تحميل المحادثات...</div>
                </div>
            </div>

            <!-- Chat Window -->
            <div id="chat-window" class="hidden md:flex flex-1 flex-col bg-white">
                <div class="p-4 border-b flex items-center justify-between bg-white z-10">
                    <div class="flex items-center gap-3">
                        <button onclick="backToList()" class="md:hidden text-gray-400 p-2">➡</button>
                        <div id="active-user-avatar" class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-black text-sm">؟</div>
                        <div>
                            <h3 id="active-user-name" class="font-black text-sm text-gray-800 leading-none text-right">المحادثة</h3>
                            <span class="text-[9px] text-green-500 font-bold block text-right mt-1">نشط الآن</span>
                        </div>
                    </div>
                </div>

                <div id="ad-context-bar" class="hidden bg-blue-50/50 p-2 px-4 border-b flex items-center gap-3">
                    <img id="ad-context-img" src="" class="w-10 h-10 rounded-lg object-cover border border-white shadow-sm bg-white">
                    <div class="flex-1 overflow-hidden">
                        <h4 id="ad-context-title" class="text-[10px] font-black text-gray-700 truncate">اسم الإعلان</h4>
                        <p id="ad-context-price" class="text-[9px] font-bold text-blue-600 mt-0.5">0 ج.م</p>
                    </div>
                </div>

                <div id="messages-box" class="flex-1 overflow-y-auto p-6 space-y-4 no-scrollbar bg-gray-50/10 flex flex-col"></div>

                <div class="p-4 bg-white border-t">
                    <form id="chat-form" class="flex items-center gap-3">
                        <input type="text" id="msg-input" autocomplete="off" placeholder="اكتب رسالتك هنا..."
                               class="flex-1 bg-gray-100 border-none rounded-2xl py-3.5 px-5 text-sm outline-none focus:ring-2 focus:ring-blue-500 text-right">
                        <button type="submit" id="send-btn" class="bg-blue-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg active:scale-90 transition-all">
                            <span class="text-xl">✈</span>
                        </button>
                    </form>
                </div>
            </div>

            <div id="empty-chat" class="hidden md:flex flex-1 flex-col items-center justify-center text-gray-300 bg-white">
                <div class="w-24 h-24 bg-gray-50 rounded-full flex items-center justify-center text-5xl mb-4">💬</div>
                <p class="font-black text-gray-400">اختر محادثة للبدء في الدردشة</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { db, collection, addDoc, query, orderBy, onSnapshot, where, serverTimestamp, doc, updateDoc, getDoc, getDocs, arrayUnion } from "./firebase-config.js";

        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) window.location.href = 'login.html';

        if (Notification.permission === "default") { Notification.requestPermission(); }
        document.getElementById('current-user-avatar').innerText = (user.name || user.email).charAt(0).toUpperCase();

        let currentChatId = null;
        let unsubMessages = null;

        window.deleteConversation = async function(chatId) {
            if (confirm('هل تريد حذف هذه المحادثة من قائمتك؟')) {
                try {
                    await updateDoc(doc(db, "chats", chatId), {
                        hiddenFor: arrayUnion(user.email)
                    });
                } catch (e) { console.error("Error deleting chat:", e); }
            }
        };

        let pressTimer;
        window.startPress = (id) => pressTimer = window.setTimeout(() => window.deleteConversation(id), 800);
        window.cancelPress = () => clearTimeout(pressTimer);

        window.openChat = async function(chatId, otherPartyEmail, adInfo = null) {
            if (unsubMessages) unsubMessages();
            currentChatId = chatId;
            const name = otherPartyEmail.split('@')[0];
            document.getElementById('active-user-name').innerText = name;
            document.getElementById('active-user-avatar').innerText = name.charAt(0).toUpperCase();

            const adBar = document.getElementById('ad-context-bar');
            if (adInfo && adInfo.img) {
                adBar.classList.remove('hidden');
                document.getElementById('ad-context-img').src = adInfo.img;
                document.getElementById('ad-context-title').innerText = adInfo.title;
                document.getElementById('ad-context-price').innerText = adInfo.price + " ج.م";
            } else { adBar.classList.add('hidden'); }

            if (window.innerWidth < 768) {
                document.getElementById('conv-list').classList.add('hidden');
                document.getElementById('main-header').classList.add('hidden');
            }
            document.getElementById('chat-window').classList.remove('hidden', 'md:hidden');
            document.getElementById('chat-window').classList.add('flex');
            document.getElementById('empty-chat').classList.add('hidden');
            loadMessages(chatId);

            const userKey = user.email.replace(/\./g, '_');
            try { await updateDoc(doc(db, "chats", chatId), { [`unreadCount.${userKey}`]: 0 }); } catch(e) {}
        };

        window.backToList = function() {
            document.getElementById('conv-list').classList.remove('hidden');
            document.getElementById('main-header').classList.remove('hidden');
            document.getElementById('chat-window').classList.add('hidden');
            document.getElementById('chat-window').classList.remove('flex');
            currentChatId = null;
        };

        function loadMessages(chatId) {
            const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
            unsubMessages = onSnapshot(q, (snapshot) => {
                const box = document.getElementById('messages-box');
                box.innerHTML = '';
                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    const isMe = msg.sender === user.email;
                    box.insertAdjacentHTML('beforeend', `
                        <div class="flex ${isMe ? 'justify-start' : 'justify-end'}">
                            <div class="${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white border border-gray-100 text-gray-800 rounded-bl-none'} p-3 px-4 rounded-2xl shadow-sm msg-bubble">
                                <p class="text-sm font-bold text-right">${msg.text}</p>
                            </div>
                        </div>`);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !currentChatId) return;
            const sendBtn = document.getElementById('send-btn');
            input.value = '';
            sendBtn.disabled = true;

            try {
                const chatRef = doc(db, "chats", currentChatId);
                const chatSnap = await getDoc(chatRef);
                const chatData = chatSnap.data();
                const otherEmail = chatData.participants.find(p => p !== user.email);
                const otherKey = otherEmail.replace(/\./g, '_');

                await addDoc(collection(db, "chats", currentChatId, "messages"), {
                    text: text, sender: user.email, timestamp: serverTimestamp()
                });
                await updateDoc(chatRef, {
                    lastMessage: text, lastMessageTime: serverTimestamp(), hiddenFor: [],
                    [`unreadCount.${otherKey}`]: (chatData.unreadCount?.[otherKey] || 0) + 1
                });
            } catch (err) {
                console.error("Send error:", err);
                alert("خطأ في الإرسال");
                input.value = text;
            } finally { sendBtn.disabled = false; }
        });

        function fetchConversations() {
            const q = query(collection(db, "chats"), where("participants", "array-contains", user.email));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('conversations-container');
                if (snapshot.empty) { container.innerHTML = '<div class="p-10 text-center text-gray-400 text-xs font-bold">لا توجد محادثات</div>'; return; }

                const chats = [];
                snapshot.forEach(d => chats.push({id: d.id, ...d.data()}));
                chats.sort((a, b) => (b.lastMessageTime?.seconds || 0) - (a.lastMessageTime?.seconds || 0));

                container.innerHTML = '';
                chats.forEach((chat) => {
                    if (chat.hiddenFor && chat.hiddenFor.includes(user.email)) return;
                    const otherEmail = chat.participants.find(e => e !== user.email);
                    if (!otherEmail) return;
                    const name = otherEmail.split('@')[0];
                    const userKey = user.email.replace(/\./g, '_');
                    const unread = chat.unreadCount?.[userKey] || 0;

                    if (unread > 0 && currentChatId !== chat.id) { showBrowserNotification(name, chat.lastMessage); }

                    const adImg = chat.lastAd?.img || '';
                    const avatar = adImg ? `<img src="${adImg}" class="w-12 h-12 rounded-2xl object-cover border shadow-sm">`
                        : `<div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center font-black text-lg">${name.charAt(0).toUpperCase()}</div>`;

                    const div = document.createElement('div');
                    div.className = `conv-item p-5 flex items-center gap-4 cursor-pointer hover:bg-white border-b border-gray-50 ${currentChatId === chat.id ? 'bg-white border-r-4 border-r-blue-600' : ''}`;

                    div.onmousedown = () => window.startPress(chat.id);
                    div.onmouseup = () => window.cancelPress();
                    div.ontouchstart = () => window.startPress(chat.id);
                    div.ontouchend = () => window.cancelPress();
                    div.onclick = () => window.openChat(chat.id, otherEmail, chat.lastAd);

                    div.innerHTML = `
                        <div class="relative">${avatar}${unread > 0 ? '<div class="absolute -top-1 -right-1 unread-dot"></div>' : ''}</div>
                        <div class="flex-1 overflow-hidden">
                            <div class="flex justify-between items-center">
                                <h4 class="font-black text-sm text-gray-800">${name}</h4>
                                ${unread > 0 ? `<span class="bg-blue-600 text-white text-[8px] px-1.5 py-0.5 rounded-full">${unread}</span>` : ''}
                            </div>
                            <p class="text-[10px] text-gray-400 truncate">${chat.lastMessage || 'بدء محادثة جديدة...'}</p>
                        </div>`;
                    container.appendChild(div);
                });
            });
        }

        function showBrowserNotification(sender, text) {
            if (Notification.permission === "granted") { new Notification("روبابيكيا: رسالة من " + sender, { body: text }); }
        }

        async function checkIncomingChat() {
            const params = new URLSearchParams(window.location.search);
            const sellerEmail = params.get('seller');
            if (!sellerEmail || sellerEmail === user.email) return;
            const adData = params.get('ad') ? { title: params.get('ad'), img: params.get('img'), price: params.get('price'), id: params.get('adId') } : null;

            const q = query(collection(db, "chats"), where("participants", "array-contains", user.email));
            const snap = await getDocs(q);
            let chat = snap.docs.find(d => d.data().participants.includes(sellerEmail));

            if (chat) {
                if (adData) await updateDoc(doc(db, "chats", chat.id), { lastAd: adData, hiddenFor: [] });
                window.openChat(chat.id, sellerEmail, adData || chat.data().lastAd);
            } else {
                const newC = await addDoc(collection(db, "chats"), {
                    participants: [user.email, sellerEmail], lastAd: adData, createdAt: serverTimestamp(),
                    lastMessage: "", lastMessageTime: serverTimestamp(), unreadCount: {}, hiddenFor: []
                });
                window.openChat(newC.id, sellerEmail, adData);
            }
        }

        fetchConversations();
        checkIncomingChat();
    </script>
</body>
</html>
