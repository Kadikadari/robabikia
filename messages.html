<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرسائل - روبابيكيا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .logo-gradient { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .chat-container { height: calc(100vh - 120px); }
        @media (max-width: 768px) { .chat-container { height: calc(100vh - 80px); } }
        .msg-bubble { max-width: 80%; word-wrap: break-word; }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-hidden">

    <header id="main-header" class="bg-white p-4 border-b shadow-sm z-50">
        <div class="container mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <div class="logo-gradient text-white w-9 h-9 flex items-center justify-center rounded-xl font-black text-lg">ر</div>
                <span class="text-lg font-black tracking-tighter">روبا<span class="text-blue-600">بيكيا</span></span>
            </a>
            <div id="current-user-avatar" class="w-9 h-9 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center font-black text-xs border border-white shadow-sm">؟</div>
        </div>
    </header>

    <main class="flex-1 container mx-auto p-0 md:p-4">
        <div class="bg-white md:rounded-3xl shadow-2xl border border-gray-100 flex overflow-hidden chat-container">

            <!-- Conversations List -->
            <div id="conv-list" class="w-full md:w-96 border-l border-gray-100 flex flex-col bg-gray-50/30">
                <div class="p-6 bg-white border-b flex justify-between items-center">
                    <h2 class="text-xl font-black text-gray-800">الرسائل</h2>
                </div>
                <div id="conversations-container" class="flex-1 overflow-y-auto no-scrollbar">
                    <div class="p-10 text-center text-gray-400 text-xs font-bold italic">جاري تحميل المحادثات...</div>
                </div>
            </div>

            <!-- Chat Window -->
            <div id="chat-window" class="hidden md:flex flex-1 flex-col bg-white">
                <div class="p-4 border-b flex items-center justify-between bg-white z-10">
                    <div class="flex items-center gap-3">
                        <button onclick="backToList()" class="md:hidden text-gray-400 p-2">➡</button>
                        <div id="active-user-avatar" class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-black text-sm">؟</div>
                        <div>
                            <h3 id="active-user-name" class="font-black text-sm text-gray-800 leading-none">جاري التحميل...</h3>
                            <span class="text-[9px] text-green-500 font-bold">نشط الآن</span>
                        </div>
                    </div>
                </div>

                <!-- Messages Area -->
                <div id="messages-box" class="flex-1 overflow-y-auto p-6 space-y-4 no-scrollbar bg-gray-50/10 flex flex-col">
                    <!-- الرسائل ستظهر هنا -->
                </div>

                <!-- Input Area -->
                <div class="p-4 bg-white border-t">
                    <form id="chat-form" class="flex items-center gap-3">
                        <input type="text" id="msg-input" autocomplete="off" placeholder="اكتب رسالتك هنا..."
                               class="flex-1 bg-gray-100 border-none rounded-2xl py-3.5 px-5 text-sm outline-none focus:ring-2 focus:ring-blue-500 text-right">
                        <button type="submit" class="bg-blue-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg active:scale-90 transition-all">
                            <span class="text-xl">✈</span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Empty State -->
            <div id="empty-chat" class="hidden md:flex flex-1 flex-col items-center justify-center text-gray-300 bg-white">
                <div class="w-24 h-24 bg-gray-50 rounded-full flex items-center justify-center text-5xl mb-4">💬</div>
                <p class="font-black text-gray-400">اختر محادثة للبدء في الدردشة</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { db, collection, addDoc, query, orderBy, onSnapshot, where, serverTimestamp } from "./firebase-config.js";

        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) window.location.href = 'login.html';

        document.getElementById('current-user-avatar').innerText = (user.name || user.email).charAt(0).toUpperCase();

        let currentChatId = null;
        let unsubMessages = null;

        // دالة لفتح محادثة
        window.openChat = function(chatId, otherPartyEmail) {
            if (unsubMessages) unsubMessages(); // إلغاء الاشتراك السابق
            currentChatId = chatId;

            const name = otherPartyEmail.split('@')[0];
            document.getElementById('active-user-name').innerText = name;
            document.getElementById('active-user-avatar').innerText = name.charAt(0).toUpperCase();

            // للتحكم في الموبايل
            if (window.innerWidth < 768) {
                document.getElementById('conv-list').classList.add('hidden');
                document.getElementById('main-header').classList.add('hidden');
            }
            document.getElementById('chat-window').classList.remove('hidden');
            document.getElementById('chat-window').classList.add('flex');
            document.getElementById('empty-chat').classList.add('hidden');

            loadMessages(chatId);
        };

        window.backToList = function() {
            document.getElementById('conv-list').classList.remove('hidden');
            document.getElementById('main-header').classList.remove('hidden');
            document.getElementById('chat-window').classList.add('hidden');
            document.getElementById('chat-window').classList.remove('flex');
        };

        // تحميل الرسائل الحقيقية
        function loadMessages(chatId) {
            const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
            unsubMessages = onSnapshot(q, (snapshot) => {
                const box = document.getElementById('messages-box');
                box.innerHTML = '';
                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    const isMe = msg.sender === user.email;
                    const msgHtml = `
                        <div class="flex ${isMe ? 'justify-start' : 'justify-end'}">
                            <div class="${isMe ? 'bg-blue-600 text-white rounded-br-none' : 'bg-white border border-gray-100 text-gray-800 rounded-bl-none'} p-3 px-4 rounded-2xl shadow-sm msg-bubble">
                                <p class="text-sm font-bold text-right">${msg.text}</p>
                            </div>
                        </div>`;
                    box.insertAdjacentHTML('beforeend', msgHtml);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        // إرسال رسالة
        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !currentChatId) return;

            input.value = '';
            try {
                await addDoc(collection(db, "chats", currentChatId, "messages"), {
                    text: text,
                    sender: user.email,
                    timestamp: serverTimestamp()
                });
            } catch (err) { console.error(err); }
        });

        // جلب قائمة المحادثات التي يكون المستخدم طرفاً فيها
        function fetchConversations() {
            const q = query(collection(db, "chats"), where("participants", "array-contains", user.email));
            onSnapshot(q, (snapshot) => {
                const container = document.getElementById('conversations-container');
                if (snapshot.empty) {
                    container.innerHTML = '<div class="p-10 text-center text-gray-400 text-xs font-bold">لا توجد محادثات بعد</div>';
                    return;
                }
                container.innerHTML = '';
                snapshot.forEach((doc) => {
                    const chat = doc.data();
                    const otherEmail = chat.participants.find(e => e !== user.email);
                    const name = otherEmail.split('@')[0];
                    const chatHtml = `
                        <div onclick="openChat('${doc.id}', '${otherEmail}')" class="p-5 flex items-center gap-4 cursor-pointer hover:bg-white transition-all border-b border-gray-50 ${currentChatId === doc.id ? 'bg-white border-r-4 border-r-blue-600' : ''}">
                            <div class="w-12 h-12 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center font-black text-lg">${name.charAt(0).toUpperCase()}</div>
                            <div class="flex-1">
                                <h4 class="font-black text-sm text-gray-800">${name}</h4>
                                <p class="text-[10px] text-gray-400 truncate">اضغط لمتابعة الدردشة</p>
                            </div>
                        </div>`;
                    container.insertAdjacentHTML('beforeend', chatHtml);
                });
            });
        }

        // التعامل مع البدء بمحادثة جديدة من صفحة الإعلان
        async function checkIncomingChat() {
            const params = new URLSearchParams(window.location.search);
            const sellerEmail = params.get('seller');
            const adTitle = params.get('ad');

            if (sellerEmail && sellerEmail !== user.email) {
                // البحث هل توجد محادثة سابقة
                const q = query(collection(db, "chats"), where("participants", "array-contains", user.email));
                onSnapshot(q, async (snapshot) => {
                    let existingChat = null;
                    snapshot.forEach(doc => {
                        if (doc.data().participants.includes(sellerEmail)) existingChat = { id: doc.id };
                    });

                    if (existingChat) {
                        openChat(existingChat.id, sellerEmail);
                    } else {
                        // إنشاء محادثة جديدة
                        const newChat = await addDoc(collection(db, "chats"), {
                            participants: [user.email, sellerEmail],
                            adTitle: adTitle || "بدون عنوان",
                            createdAt: serverTimestamp()
                        });
                        openChat(newChat.id, sellerEmail);
                    }
                }, { once: true });
            }
        }

        fetchConversations();
        checkIncomingChat();
    </script>
</body>
</html>
