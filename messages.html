<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>الرسائل - روبابيكيا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .logo-gradient { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .chat-container { height: calc(100vh - 120px); }
        @media (max-width: 768px) { .chat-container { height: calc(100vh - 80px); } }
    </style>
</head>
<body class="min-h-screen flex flex-col overflow-hidden">

    <header id="main-header" class="bg-white p-4 border-b shadow-sm z-50">
        <div class="container mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <div class="logo-gradient text-white w-9 h-9 flex items-center justify-center rounded-xl font-black text-lg">ر</div>
                <span class="text-lg font-black tracking-tighter">روبا<span class="text-blue-600">بيكيا</span></span>
            </a>
            <div id="current-user-avatar" class="w-9 h-9 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center font-black text-xs border border-white shadow-sm">؟</div>
        </div>
    </header>

    <main class="flex-1 container mx-auto p-0 md:p-4">
        <div class="bg-white md:rounded-3xl shadow-2xl border border-gray-100 flex overflow-hidden chat-container">

            <!-- Conversations List -->
            <div id="conv-list" class="w-full md:w-96 border-l border-gray-100 flex flex-col bg-gray-50/30">
                <div class="p-6 bg-white border-b">
                    <h2 class="text-xl font-black text-gray-800">الرسائل</h2>
                </div>
                <div id="conversations-container" class="flex-1 overflow-y-auto no-scrollbar">
                    <!-- سيتم ملء المحادثات من Firestore -->
                    <div class="p-10 text-center text-gray-400 text-xs font-bold">جاري تحميل المحادثات...</div>
                </div>
            </div>

            <!-- Chat Window -->
            <div id="chat-window" class="hidden md:flex flex-1 flex-col bg-white">
                <div class="p-4 border-b flex items-center justify-between bg-white z-10">
                    <div class="flex items-center gap-3">
                        <button onclick="backToList()" class="md:hidden text-gray-400 p-2">➡</button>
                        <div id="active-user-avatar" class="w-10 h-10 bg-blue-100 text-blue-600 rounded-full flex items-center justify-center font-black text-sm">؟</div>
                        <div>
                            <h3 id="active-user-name" class="font-black text-sm text-gray-800 leading-none">اختر محادثة</h3>
                            <span class="text-[9px] text-green-500 font-bold">متصل الآن</span>
                        </div>
                    </div>
                </div>

                <!-- Messages Area -->
                <div id="messages-box" class="flex-1 overflow-y-auto p-6 space-y-4 no-scrollbar bg-gray-50/20">
                    <div class="flex justify-center py-20 text-gray-300 font-bold">ابدأ المحادثة الآن</div>
                </div>

                <!-- Input Area -->
                <div class="p-4 bg-white border-t">
                    <form id="chat-form" class="flex items-center gap-3">
                        <input type="text" id="msg-input" placeholder="اكتب رسالتك هنا..."
                               class="flex-1 bg-gray-100 border-none rounded-2xl py-3.5 px-5 text-sm outline-none focus:ring-2 focus:ring-blue-500">
                        <button type="submit" class="bg-blue-600 text-white w-12 h-12 rounded-2xl flex items-center justify-center shadow-lg active:scale-90 transition-all">
                            <span class="text-xl">✈</span>
                        </button>
                    </form>
                </div>
            </div>

            <!-- Empty State -->
            <div id="empty-chat" class="hidden md:flex flex-1 flex-col items-center justify-center text-gray-300 bg-white">
                <div class="w-24 h-24 bg-gray-50 rounded-full flex items-center justify-center text-5xl mb-4">💬</div>
                <p class="font-black text-gray-400">اختر محادثة للبدء في البيع أو الشراء</p>
            </div>
        </div>
    </main>

    <script type="module">
        import { db, collection, addDoc, query, orderBy, onSnapshot, where, serverTimestamp } from "./firebase-config.js";

        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) window.location.href = 'login.html';

        document.getElementById('current-user-avatar').innerText = user.name.charAt(0).toUpperCase();

        let currentChatId = null;

        // دالة لفتح محادثة معينة
        window.openChat = function(chatId, otherPartyName) {
            currentChatId = chatId;
            document.getElementById('active-user-name').innerText = otherPartyName;
            document.getElementById('active-user-avatar').innerText = otherPartyName.charAt(0);

            if (window.innerWidth < 768) {
                document.getElementById('conv-list').classList.add('hidden');
                document.getElementById('main-header').classList.add('hidden');
                document.getElementById('chat-window').classList.remove('hidden');
                document.getElementById('chat-window').classList.add('flex');
            } else {
                document.getElementById('chat-window').classList.remove('hidden');
                document.getElementById('chat-window').classList.add('flex');
                document.getElementById('empty-chat').classList.add('hidden');
            }

            loadMessages(chatId);
        };

        window.backToList = function() {
            document.getElementById('conv-list').classList.remove('hidden');
            document.getElementById('main-header').classList.remove('hidden');
            document.getElementById('chat-window').classList.add('hidden');
            document.getElementById('chat-window').classList.remove('flex');
        };

        // تحميل الرسائل من Firestore
        function loadMessages(chatId) {
            const q = query(collection(db, "chats", chatId, "messages"), orderBy("timestamp", "asc"));
            onSnapshot(q, (snapshot) => {
                const box = document.getElementById('messages-box');
                box.innerHTML = '';
                snapshot.forEach((doc) => {
                    const msg = doc.data();
                    const isMe = msg.sender === user.email;
                    const msgHtml = `
                        <div class="flex items-end gap-3 ${isMe ? 'flex-row-reverse mr-12' : 'ml-12'}">
                            <div class="${isMe ? 'bg-blue-600 text-white rounded-bl-none' : 'bg-white border border-gray-100 text-gray-800 rounded-br-none'} p-4 rounded-2xl shadow-sm max-w-[85%]">
                                <p class="text-sm leading-relaxed font-bold">${msg.text}</p>
                            </div>
                        </div>
                    `;
                    box.insertAdjacentHTML('beforeend', msgHtml);
                });
                box.scrollTop = box.scrollHeight;
            });
        }

        // إرسال رسالة جديدة
        document.getElementById('chat-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const input = document.getElementById('msg-input');
            const text = input.value.trim();
            if (!text || !currentChatId) return;

            try {
                await addDoc(collection(db, "chats", currentChatId, "messages"), {
                    text: text,
                    sender: user.email,
                    timestamp: serverTimestamp()
                });
                input.value = '';
            } catch (err) {
                console.error("Error sending message:", err);
            }
        });

        // محاكاة تحميل قائمة المحادثات (يجب ربطها بجدول المحادثات لاحقاً)
        function loadConversations() {
            const container = document.getElementById('conversations-container');
            // محادثة تجريبية (يجب أن تنشأ عند ضغط المشتري على "دردشة" في الإعلان)
            container.innerHTML = `
                <div onclick="openChat('demo_chat_1', 'أحمد محمد')" class="p-5 flex items-center gap-4 cursor-pointer hover:bg-white transition-all border-b border-gray-50">
                    <div class="w-14 h-14 bg-blue-100 text-blue-600 rounded-2xl flex items-center justify-center font-black text-xl">أ</div>
                    <div class="flex-1">
                        <div class="flex justify-between items-center"><span class="font-black text-sm text-gray-800">أحمد محمد</span></div>
                        <p class="text-xs text-gray-400 truncate">اضغط للبدء في مراسلته</p>
                    </div>
                </div>
            `;
        }

        loadConversations();
    </script>
</body>
</html>
