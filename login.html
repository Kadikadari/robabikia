<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - روبابيكيا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .logo-gradient { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); }
        .form-container { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header (Simplified) -->
    <header class="bg-white p-4 border-b flex justify-center">
        <a href="index.html" class="flex items-center gap-2">
            <div class="logo-gradient text-white w-10 h-10 flex items-center justify-center rounded-xl font-black text-xl shadow-lg">ر</div>
            <span class="text-xl font-black tracking-tighter">روبا<span class="text-blue-600">بيكيا</span></span>
        </a>
    </header>

    <!-- Main Content -->
    <main class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-xl border border-gray-100 overflow-hidden form-container">

            <!-- Tabs -->
            <div class="flex border-b">
                <button id="login-tab" onclick="switchTab('login')" class="flex-1 py-4 text-sm font-black transition-all border-b-2 border-blue-600 text-blue-600">تسجيل الدخول</button>
                <button id="signup-tab" onclick="switchTab('signup')" class="flex-1 py-4 text-sm font-black text-gray-400 border-b-2 border-transparent hover:text-gray-600 transition-all">إنشاء حساب جديد</button>
            </div>

            <!-- Login Form -->
            <div id="login-form" class="p-8">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-black text-gray-800">حمداً لله على سلامتك!</h2>
                    <p class="text-xs text-gray-400 font-bold mt-1">سجل دخولك عشان تبدأ تبيع وتشتري</p>
                </div>

                <form id="actual-login-form" onsubmit="handleLogin(event)" class="space-y-4">
                    <div>
                        <label class="text-xs font-black text-gray-600 block mb-2 mr-1">البريد الإلكتروني</label>
                        <input type="email" id="login-email" required placeholder="example@mail.com" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 transition-all text-sm text-right">
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-xs font-black text-gray-600 mr-1">كلمة المرور</label>
                            <a href="#" class="text-[10px] font-bold text-blue-600 hover:underline">نسيت كلمة السر؟</a>
                        </div>
                        <input type="password" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 transition-all text-sm text-right">
                    </div>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-black text-sm shadow-lg shadow-blue-100 transition-all active:scale-95 mt-6">دخول</button>
                </form>

                <div class="mt-8 flex items-center gap-4 text-gray-300">
                    <div class="flex-1 h-[1px] bg-gray-100"></div>
                    <span class="text-[10px] font-bold">أو عن طريق</span>
                    <div class="flex-1 h-[1px] bg-gray-100"></div>
                </div>

                <div class="grid grid-cols-2 gap-3 mt-6">
                    <button onclick="socialLogin('جوجل')" class="flex items-center justify-center gap-2 border border-gray-100 py-3 rounded-2xl hover:bg-gray-50 transition-all">
                        <img src="https://www.svgrepo.com/show/475656/google-color.svg" class="w-5 h-5" alt="google">
                        <span class="text-[10px] font-black">جوجل</span>
                    </button>
                    <button onclick="socialLogin('فيسبوك')" class="flex items-center justify-center gap-2 border border-gray-100 py-3 rounded-2xl hover:bg-gray-50 transition-all">
                        <img src="https://www.svgrepo.com/show/475647/facebook-color.svg" class="w-5 h-5" alt="facebook">
                        <span class="text-[10px] font-black">فيسبوك</span>
                    </button>
                </div>
            </div>

            <!-- Signup Form (Updated with Email field) -->
            <div id="signup-form" class="p-8 hidden">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-black text-gray-800">أهلاً بيك في عيلتنا!</h2>
                    <p class="text-xs text-gray-400 font-bold mt-1">أنشئ حسابك في ثواني وابدأ رحلتك معنا</p>
                </div>

                <form onsubmit="handleSignup(event)" class="space-y-4">
                    <div>
                        <label class="text-xs font-black text-gray-600 block mb-2 mr-1">الاسم بالكامل</label>
                        <input type="text" id="signup-name" required placeholder="مثلاً: أحمد محمد" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 transition-all text-sm text-right">
                    </div>
                    <div>
                        <label class="text-xs font-black text-gray-600 block mb-2 mr-1">البريد الإلكتروني</label>
                        <input type="email" id="signup-email" required placeholder="example@mail.com" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 transition-all text-sm text-right">
                    </div>
                    <div>
                        <label class="text-xs font-black text-gray-600 block mb-2 mr-1">كلمة المرور</label>
                        <input type="password" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 transition-all text-sm text-right">
                    </div>
                    <p class="text-[10px] text-gray-400 text-center px-4">بإنشاء حساب، أنت توافق على <a href="#" class="text-blue-600 underline">شروط الاستخدام</a> و <a href="#" class="text-blue-600 underline">سياسة الخصوصية</a></p>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-black text-sm shadow-lg shadow-blue-100 transition-all active:scale-95 mt-6">إنشاء حساب</button>
                </form>
            </div>

        </div>
    </main>

    <!-- Footer -->
    <footer class="p-6 text-center text-gray-400 text-[10px] font-bold">
        جميع الحقوق محفوظة © 2024 روبابيكيا
    </footer>

    <script>
        function switchTab(type) {
            const loginForm = document.getElementById('login-form');
            const signupForm = document.getElementById('signup-form');
            const loginTab = document.getElementById('login-tab');
            const signupTab = document.getElementById('signup-tab');

            if (type === 'login') {
                loginForm.classList.remove('hidden');
                signupForm.classList.add('hidden');
                loginTab.classList.add('border-blue-600', 'text-blue-600');
                loginTab.classList.remove('text-gray-400', 'border-transparent');
                signupTab.classList.remove('border-blue-600', 'text-blue-600');
                signupTab.classList.add('text-gray-400', 'border-transparent');
            } else {
                loginForm.classList.add('hidden');
                signupForm.classList.remove('hidden');
                signupTab.classList.add('border-blue-600', 'text-blue-600');
                signupTab.classList.remove('text-gray-400', 'border-transparent');
                loginTab.classList.remove('border-blue-600', 'text-blue-600');
                loginTab.classList.add('text-gray-400', 'border-transparent');
            }
        }

        function handleLogin(e) {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const userData = {
                name: email.split('@')[0] || 'مستخدم روبابيكيا',
                isLoggedIn: true
            };
            localStorage.setItem('user', JSON.stringify(userData));
            window.location.href = 'index.html';
        }

        function handleSignup(e) {
            e.preventDefault();
            const name = document.getElementById('signup-name').value;
            const userData = {
                name: name,
                isLoggedIn: true
            };
            localStorage.setItem('user', JSON.stringify(userData));
            window.location.href = 'index.html';
        }

        function socialLogin(platform) {
            const userData = {
                name: platform + ' User',
                isLoggedIn: true
            };
            localStorage.setItem('user', JSON.stringify(userData));
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
