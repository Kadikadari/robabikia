<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>تسجيل الدخول - روبابيكيا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .logo-gradient { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); }
        .form-container { animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <header class="bg-white p-4 border-b flex justify-center">
        <a href="index.html" class="flex items-center gap-2">
            <div class="logo-gradient text-white w-10 h-10 flex items-center justify-center rounded-xl font-black text-xl shadow-lg">ر</div>
            <span class="text-xl font-black tracking-tighter">روبا<span class="text-blue-600">بيكيا</span></span>
        </a>
    </header>

    <main class="flex-1 flex items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-xl border border-gray-100 overflow-hidden form-container">
            <div class="flex border-b">
                <button id="login-tab" class="flex-1 py-4 text-sm font-black transition-all border-b-2 border-blue-600 text-blue-600">تسجيل الدخول</button>
                <button id="signup-tab" class="flex-1 py-4 text-sm font-black text-gray-400 border-b-2 border-transparent hover:text-gray-600 transition-all">إنشاء حساب جديد</button>
            </div>

            <!-- Login Form -->
            <div id="login-form-container" class="p-8" style="display: block;">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-black text-gray-800">حمداً لله على سلامتك!</h2>
                    <p class="text-xs text-gray-400 font-bold mt-1">سجل دخولك باسمك المختار وابدأ رحلتك</p>
                </div>
                <form id="actual-login-form" class="space-y-4">
                    <div>
                        <label class="text-xs font-black text-gray-600 block mb-2 mr-1">البريد الإلكتروني</label>
                        <input type="email" id="login-email" required placeholder="example@mail.com" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 transition-all text-sm text-right">
                    </div>
                    <div>
                        <div class="flex justify-between items-center mb-2">
                            <label class="text-xs font-black text-gray-600 mr-1">كلمة المرور</label>
                            <a href="#" class="text-[10px] font-bold text-blue-600 hover:underline">نسيت كلمة السر؟</a>
                        </div>
                        <input type="password" id="login-password" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 transition-all text-sm text-right">
                    </div>
                    <p id="login-error" class="text-red-500 text-[10px] font-bold hidden text-center"></p>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-black text-sm shadow-lg shadow-blue-100 transition-all active:scale-95 mt-6">دخول</button>
                </form>
            </div>

            <!-- Signup Form -->
            <div id="signup-form-container" class="p-8" style="display: none;">
                <div class="text-center mb-8">
                    <h2 class="text-2xl font-black text-gray-800">أهلاً بيك في عيلتنا!</h2>
                    <p class="text-xs text-gray-400 font-bold mt-1">اختر اللقب الذي سيظهر للناس (خصوصيتك تهمنا)</p>
                </div>
                <form id="actual-signup-form" class="space-y-4">
                    <div>
                        <label class="text-xs font-black text-gray-600 block mb-2 mr-1">اللقب (الاسم المستعار)</label>
                        <input type="text" id="signup-name" required placeholder="مثلاً: بائع مميز، فاعل خير" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 transition-all text-sm text-right">
                    </div>
                    <div>
                        <label class="text-xs font-black text-gray-600 block mb-2 mr-1">البريد الإلكتروني</label>
                        <input type="email" id="signup-email" required placeholder="example@mail.com" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 transition-all text-sm text-right">
                    </div>
                    <div>
                        <label class="text-xs font-black text-gray-600 block mb-2 mr-1">كلمة المرور</label>
                        <input type="password" id="signup-password" required placeholder="••••••••" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 transition-all text-sm text-right">
                    </div>
                    <p id="signup-error" class="text-red-500 text-[10px] font-bold hidden text-center"></p>
                    <button type="submit" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-black text-sm shadow-lg shadow-blue-100 transition-all active:scale-95 mt-6">إنشاء حساب باللقب</button>
                </form>
            </div>
        </div>
    </main>

    <footer class="p-6 text-center text-gray-400 text-[10px] font-bold">جميع الحقوق محفوظة © 2024 روبابيكيا</footer>

    <script type="module">
        import { auth, signInWithEmailAndPassword, createUserWithEmailAndPassword, updateProfile } from "./firebase-config.js";

        // اختيار العناصر
        const loginTab = document.getElementById('login-tab');
        const signupTab = document.getElementById('signup-tab');
        const loginForm = document.getElementById('login-form-container');
        const signupForm = document.getElementById('signup-form-container');

        // وظيفة التبديل المباشرة
        function showTab(type) {
            if (type === 'login') {
                loginForm.style.display = 'block';
                signupForm.style.display = 'none';

                loginTab.classList.add('border-blue-600', 'text-blue-600');
                loginTab.classList.remove('text-gray-400', 'border-transparent');
                signupTab.classList.remove('border-blue-600', 'text-blue-600');
                signupTab.classList.add('text-gray-400', 'border-transparent');
            } else {
                loginForm.style.display = 'none';
                signupForm.style.display = 'block';

                signupTab.classList.add('border-blue-600', 'text-blue-600');
                signupTab.classList.remove('text-gray-400', 'border-transparent');
                loginTab.classList.remove('border-blue-600', 'text-blue-600');
                loginTab.classList.add('text-gray-400', 'border-transparent');
            }
        }

        // ربط الأحداث داخل الموديول
        loginTab.onclick = () => showTab('login');
        signupTab.onclick = () => showTab('signup');

        // التحقق من وجود پارامتر في الرابط لفتح تبويب معين (اختياري)
        const urlParams = new URLSearchParams(window.location.search);
        if (urlParams.get('tab') === 'signup') showTab('signup');

        // تسجيل الدخول
        document.getElementById('actual-login-form').onsubmit = async (e) => {
            e.preventDefault();
            const email = document.getElementById('login-email').value;
            const password = document.getElementById('login-password').value;
            const errorEl = document.getElementById('login-error');
            const btn = e.target.querySelector('button');

            btn.disabled = true;
            btn.innerText = "جاري الدخول...";

            try {
                const userCredential = await signInWithEmailAndPassword(auth, email, password);
                const user = userCredential.user;
                localStorage.setItem('user', JSON.stringify({
                    name: user.displayName || "عضو روبابيكيا",
                    email: email.toLowerCase()
                }));
                window.location.href = 'index.html';
            } catch (error) {
                errorEl.innerText = "خطأ في تسجيل الدخول: تأكد من البيانات";
                errorEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "دخول";
            }
        };

        // إنشاء الحساب
        document.getElementById('actual-signup-form').onsubmit = async (e) => {
            e.preventDefault();
            const nickname = document.getElementById('signup-name').value;
            const email = document.getElementById('signup-email').value;
            const password = document.getElementById('signup-password').value;
            const errorEl = document.getElementById('signup-error');
            const btn = e.target.querySelector('button');

            btn.disabled = true;
            btn.innerText = "جاري إنشاء الحساب...";

            try {
                const userCredential = await createUserWithEmailAndPassword(auth, email, password);
                await updateProfile(userCredential.user, { displayName: nickname });
                localStorage.setItem('user', JSON.stringify({
                    name: nickname,
                    email: email.toLowerCase()
                }));
                window.location.href = 'index.html';
            } catch (error) {
                let msg = "خطأ في إنشاء الحساب";
                if (error.code === 'auth/email-already-in-use') msg = "البريد مستخدم بالفعل";
                errorEl.innerText = msg;
                errorEl.classList.remove('hidden');
                btn.disabled = false;
                btn.innerText = "إنشاء حساب باللقب";
            }
        };
    </script>
</body>
</html>
