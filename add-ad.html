<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أضف إعلانك - روبابيكيا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .logo-gradient { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); }
    </style>
</head>
<body class="min-h-screen flex flex-col text-right">

    <!-- Header -->
    <header class="bg-white p-4 border-b shadow-sm sticky top-0 z-50">
        <div class="container mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <div class="logo-gradient text-white w-10 h-10 flex items-center justify-center rounded-xl font-black text-xl">ر</div>
                <span class="text-xl font-black tracking-tighter">روبا<span class="text-blue-600">بيكيا</span></span>
            </a>
            <h1 class="text-lg font-black text-gray-800">إضافة إعلان</h1>
            <a href="index.html" class="text-gray-400 hover:text-red-500 font-bold text-2xl">✕</a>
        </div>
    </header>

    <main class="flex-1 container mx-auto max-w-2xl p-4 py-8">
        <div class="bg-white rounded-3xl shadow-xl border border-gray-100 p-6 sm:p-8">
            <form id="add-ad-form" class="space-y-8">

                <!-- Photos (UI Only for now) -->
                <section>
                    <h3 class="text-lg font-black text-gray-800 mb-4 flex items-center gap-2">📸 صور المنتج</h3>
                    <div class="grid grid-cols-3 sm:grid-cols-4 gap-3">
                        <label class="aspect-square border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition-all">
                            <span class="text-2xl">📸</span>
                            <input type="file" id="ad-images" class="hidden" multiple accept="image/*">
                        </label>
                    </div>
                </section>

                <!-- Basic Details -->
                <section class="space-y-4">
                    <h3 class="text-lg font-black text-gray-800">📝 تفاصيل الإعلان</h3>
                    <div>
                        <label class="text-xs font-black text-gray-600 block mb-2 mr-1">العنوان</label>
                        <input type="text" id="title" required placeholder="عنوان جذاب للمنتج" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    </div>
                    <div class="grid grid-cols-2 gap-4">
                        <div>
                            <label class="text-xs font-black text-gray-600 block mb-2 mr-1">الفئة</label>
                            <select id="main-category" onchange="updateSubCategories()" required class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 text-sm appearance-none">
                                <option value="">اختر الفئة</option>
                                <option value="cars">سيارات</option>
                                <option value="real">عقارات</option>
                                <option value="elec">إلكترونيات</option>
                                <option value="fashion">ملابس</option>
                                <option value="home">أثاث</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-black text-gray-600 block mb-2 mr-1">السعر (ج.م)</label>
                            <input type="number" id="price" required placeholder="0.00" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                        </div>
                    </div>
                    <div id="sub-category-container" class="hidden">
                        <label class="text-xs font-black text-gray-600 block mb-2 mr-1">الفئة الفرعية</label>
                        <select id="sub-category" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 text-sm appearance-none"></select>
                    </div>
                    <div>
                        <label class="text-xs font-black text-gray-600 block mb-2 mr-1">الوصف</label>
                        <textarea id="description" rows="4" required placeholder="اكتب تفاصيل المنتج..." class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none"></textarea>
                    </div>
                </section>

                <hr class="border-gray-50">

                <!-- Contact & Submit -->
                <section class="space-y-4">
                    <h3 class="text-lg font-black text-gray-800">📍 الموقع والتواصل</h3>
                    <input type="text" id="location" required placeholder="المكان (مثلاً: المعادي، القاهرة)" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 text-sm">
                    <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-black text-lg shadow-lg transition-all active:scale-95">نشر الإعلان الآن</button>
                </section>
            </form>
        </div>
    </main>

    <div id="success-modal" class="fixed inset-0 z-[1000] bg-black/60 hidden items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full text-center space-y-6 animate-in zoom-in duration-300">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-4xl mx-auto">✓</div>
            <h3 class="text-xl font-black">تم النشر في Supabase بنجاح!</h3>
            <button onclick="window.location.href='index.html'" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-black text-sm">العودة للرئيسية</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from "./supabase-config.js";

        const subCategories = {
            'real': ['شراء', 'استئجار', 'أرض', 'شاليهات', 'فيلة'],
            'elec': ['هواتف', 'حاسوب ولابتوب', 'أدوات منزلية'],
            'fashion': ['رجالي', 'نسائي', 'أطفال', 'أحذية', 'ساعات وإكسسوارات', 'مكياج'],
            'cars': ['سيارات مستعملة', 'سيارات جديدة', 'موتوسيكلات', 'قطع غيار'],
            'home': ['صالون', 'مطبخ', 'غرفة نوم', 'حديقة']
        };

        window.updateSubCategories = function() {
            const mainCat = document.getElementById('main-category').value;
            const subContainer = document.getElementById('sub-category-container');
            const subSelect = document.getElementById('sub-category');
            if (mainCat && subCategories[mainCat]) {
                subSelect.innerHTML = '<option value="">اختر الفئة الفرعية</option>' + subCategories[mainCat].map(sub => `<option value="${sub}">${sub}</option>`).join('');
                subContainer.classList.remove('hidden');
            } else { subContainer.classList.add('hidden'); }
        };

        document.getElementById('add-ad-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "جاري الحفظ في Supabase...";
            btn.disabled = true;

            const user = JSON.parse(localStorage.getItem('user'));

            const adData = {
                title: document.getElementById('title').value,
                main_category: document.getElementById('main-category').value,
                sub_category: document.getElementById('sub-category').value,
                price: document.getElementById('price').value,
                description: document.getElementById('description').value,
                location: document.getElementById('location').value,
                seller_email: user ? user.email : 'guest',
                created_at: new Date()
            };

            try {
                const { data, error } = await supabase.from('ads').insert([adData]);
                if (error) throw error;
                document.getElementById('success-modal').style.display = 'flex';
            } catch (error) {
                alert("خطأ في الاتصال بـ Supabase: تأكد من إعداداتك ورابط الـ URL");
                console.error(error);
            } finally {
                btn.innerText = "نشر الإعلان الآن";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
