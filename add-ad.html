<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>أضف إعلانك - روبابيكيا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
        .logo-gradient { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); }
        .fade-in-down { animation: fadeInDown 0.3s ease-out; }
        @keyframes fadeInDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="min-h-screen flex flex-col text-right">

    <header class="bg-white p-4 border-b shadow-sm sticky top-0 z-50">
        <div class="container mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <div class="logo-gradient text-white w-10 h-10 flex items-center justify-center rounded-xl font-black text-xl shadow-lg">ر</div>
                <span class="text-xl font-black tracking-tighter">روبا<span class="text-blue-600">بيكيا</span></span>
            </a>
            <h1 class="text-lg font-black text-gray-800 hidden sm:block">نشر إعلان جديد</h1>
            <a href="index.html" class="text-gray-400 hover:text-red-500 font-bold text-2xl transition-all">✕</a>
        </div>
    </header>

    <main class="flex-1 container mx-auto max-w-2xl p-4 py-8">
        <div class="bg-white rounded-3xl shadow-xl border border-gray-100 p-6 sm:p-10">
            <form id="add-ad-form" class="space-y-8">

                <section>
                    <h3 class="text-lg font-black text-gray-800 mb-4 flex items-center gap-2">📸 صور المنتج</h3>
                    <div class="grid grid-cols-3 sm:grid-cols-4 gap-3 text-center">
                        <label class="aspect-square border-2 border-dashed border-gray-200 rounded-2xl flex flex-col items-center justify-center cursor-pointer hover:border-blue-500 hover:bg-blue-50 transition-all group">
                            <span class="text-2xl">📸</span>
                            <span class="text-[10px] font-bold text-gray-400">أضف صور</span>
                            <input type="file" id="ad-images" class="hidden" multiple accept="image/*">
                        </label>
                        <div class="aspect-square bg-gray-50 rounded-2xl border border-gray-100 flex items-center justify-center text-[10px] text-gray-300">الصورة 2</div>
                        <div class="aspect-square bg-gray-50 rounded-2xl border border-gray-100 flex items-center justify-center text-[10px] text-gray-300">الصورة 3</div>
                    </div>
                </section>

                <hr class="border-gray-50">

                <section class="space-y-5">
                    <h3 class="text-lg font-black text-gray-800 mb-2 flex items-center gap-2">📝 تفاصيل الإعلان</h3>
                    <div>
                        <label class="text-xs font-black text-gray-600 block mb-2 mr-1 text-right">عنوان الإعلان</label>
                        <input type="text" id="title" required placeholder="مثلاً: ايفون 13 برو ماكس بحالة الزيرو" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 text-sm text-right">
                    </div>

                    <div class="grid grid-cols-1 sm:grid-cols-2 gap-5">
                        <div>
                            <label class="text-xs font-black text-gray-600 block mb-2 mr-1 text-right">الفئة الأساسية</label>
                            <select id="main-category" required class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 text-sm appearance-none text-right">
                                <option value="">اختر الفئة</option>
                                <option value="real">عقارات</option>
                                <option value="elec">إلكترونيات</option>
                                <option value="elec_appliances">كهربائيات</option>
                                <option value="fashion">ملابس</option>
                                <option value="home">أثاث</option>
                                <option value="cars">سيارات</option>
                            </select>
                        </div>
                        <div id="sub-category-container" class="hidden fade-in-down">
                            <label class="text-xs font-black text-gray-600 block mb-2 mr-1 text-right">الفئة الفرعية</label>
                            <select id="sub-category" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 text-sm appearance-none text-right">
                                <option value="">اختر الفئة الفرعية</option>
                            </select>
                        </div>
                        <div>
                            <label class="text-xs font-black text-gray-600 block mb-2 mr-1 text-right">السعر (ج.م)</label>
                            <input type="number" id="price" required placeholder="0.00" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 text-sm text-right">
                        </div>
                    </div>

                    <div>
                        <label class="text-xs font-black text-gray-600 block mb-2 mr-1 text-right">وصف المنتج</label>
                        <textarea id="description" rows="5" required placeholder="اكتب تفاصيل المنتج..." class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 text-sm resize-none text-right"></textarea>
                    </div>
                </section>

                <hr class="border-gray-50">

                <section class="space-y-4">
                    <h3 class="text-lg font-black text-gray-800 mb-4 flex items-center gap-2">📍 الموقع والتواصل</h3>
                    <input type="text" id="location" required placeholder="المكان (مثلاً: مدينة نصر، القاهرة)" class="w-full bg-gray-50 border border-gray-100 rounded-2xl py-3 px-4 outline-none focus:ring-2 focus:ring-blue-500 text-sm text-right">
                </section>

                <div class="pt-6">
                    <button type="submit" id="submit-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-black text-lg shadow-lg active:scale-95 transition-all">نشر الإعلان الآن</button>
                </div>
            </form>
        </div>
    </main>

    <div id="success-modal" class="fixed inset-0 z-[1000] bg-black/60 hidden items-center justify-center p-4 backdrop-blur-sm text-center">
        <div class="bg-white rounded-3xl p-8 max-w-sm w-full space-y-6 animate-in zoom-in duration-300">
            <div class="w-20 h-20 bg-green-100 text-green-600 rounded-full flex items-center justify-center text-4xl mx-auto">✓</div>
            <h3 class="text-xl font-black text-gray-800">تم الحفظ بنجاح!</h3>
            <p class="text-sm text-gray-400 font-bold">إعلانك متاح الآن للجميع في الموقع</p>
            <button onclick="window.location.href='index.html'" class="w-full bg-gray-900 text-white py-4 rounded-2xl font-black text-sm">العودة للرئيسية</button>
        </div>
    </div>

    <script type="module">
        import { supabase } from "./supabase-config.js";

        const subCategories = {
            'real': ['شراء', 'استئجار', 'أرض', 'شاليهات', 'فيلة'],
            'elec': ['موبايلات وهواتف', 'حواسيب', 'لابتوب', 'اجهزة اخرى'],
            'elec_appliances': ['كهربائيات المطبخ', 'تلفزيون', 'ثلاجه', 'غسالة', 'تكييف', 'اجهزة اخرى'],
            'fashion': ['رجالي', 'نسائي', 'أطفال', 'أحذية', 'ساعات وإكسسوارات', 'مكياج'],
            'home': ['صالون', 'مطبخ', 'غرفة نوم', 'حديقة'],
            'cars': ['سيارات مستعملة', 'سيارات جديدة', 'موتوسيكلات', 'قطع غيار']
        };

        const mainCatSelect = document.getElementById('main-category');
        const subContainer = document.getElementById('sub-category-container');
        const subSelect = document.getElementById('sub-category');

        mainCatSelect.addEventListener('change', () => {
            const mainCat = mainCatSelect.value;
            if (mainCat && subCategories[mainCat]) {
                subSelect.innerHTML = '<option value="">اختر الفئة الفرعية</option>' +
                    subCategories[mainCat].map(sub => `<option value="${sub}">${sub}</option>`).join('');
                subContainer.classList.remove('hidden');
            } else {
                subContainer.classList.add('hidden');
            }
        });

        document.getElementById('add-ad-form').addEventListener('submit', async (e) => {
            e.preventDefault();
            const btn = document.getElementById('submit-btn');
            btn.innerText = "جاري الحفظ...";
            btn.disabled = true;

            const user = JSON.parse(localStorage.getItem('user'));
            const adData = {
                title: document.getElementById('title').value,
                main_category: mainCatSelect.value,
                sub_category: subSelect.value,
                price: parseFloat(document.getElementById('price').value), // تحويل لرقم
                description: document.getElementById('description').value,
                location: document.getElementById('location').value,
                seller_email: user ? user.email : 'guest'
            };

            try {
                const { error } = await supabase.from('ads').insert([adData]);
                if (error) throw error;
                document.getElementById('success-modal').style.display = 'flex';
            } catch (err) {
                // إظهار الخطأ الحقيقي للتشخيص
                alert("حدث خطأ من Supabase: " + err.message);
                console.error(err);
            } finally {
                btn.innerText = "نشر الإعلان الآن";
                btn.disabled = false;
            }
        });
    </script>
</body>
</html>
