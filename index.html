<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="canonical" href="https://robabikia.vercel.app/" />
    <meta name="google-site-verification" content="jMu4iVifbTLLsfA8qMWznF-tMASr0H2gMzTnUOtX748" />
    <title>روبابيكيا - سوق بيع وشراء المنتجات في مصر | سيارات، عقارات، إلكترونيات</title>
    <meta name="description" content="روبابيكيا هو سوقك الموثوق لبيع وشراء كل شيء في مصر. تصفح آلاف الإعلانات للسيارات، العقارات، الإلكترونيات، الأثاث، والخدمات. انشر إعلانك مجاناً الآن!">
    <meta property="og:title" content="روبابيكيا - بيع واشتري أي حاجة">
    <meta property="og:image" content="https://robabikia.vercel.app/logo.png">

    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f9fafb; }
        .logo-gradient { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .ad-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .ad-card:hover { transform: translateY(-5px); box-shadow: 0 20px 25px -5px rgb(0 0 0 / 0.1); }
        .cat-btn { transition: all 0.2s; border: 2px solid transparent; }
        .cat-btn.active { border-color: #2563eb; background-color: #eff6ff; }
        #sub-menu-bar { display: none; }
        #sub-menu-bar.active { display: block; animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        #location-modal { backdrop-filter: blur(8px); }
        .msg-badge { animation: pulse 2s infinite; }
        @keyframes pulse { 0% { transform: scale(1); } 50% { transform: scale(1.1); } 100% { transform: scale(1); } }
    </style>
</head>
<body class="pb-20 md:pb-0">

    <!-- Location Modal -->
    <div id="location-modal" class="fixed inset-0 z-[4000] bg-black/40 hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden text-right">
            <div class="p-5 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-black text-lg text-gray-800">تحديد الموقع</h3>
                <button onclick="toggleLocationModal()" class="text-gray-400 text-xl font-bold">✕</button>
            </div>
            <div class="p-4">
                <input type="text" id="location-search-input" placeholder="ابحث عن مدينة..." class="w-full p-3 mb-4 rounded-xl border border-gray-100 outline-none focus:ring-2 focus:ring-blue-500 text-sm text-right bg-gray-50" oninput="filterLocationsUI()">
                <div id="location-list" class="max-h-[350px] overflow-y-auto space-y-1 no-scrollbar"></div>
            </div>
        </div>
    </div>

    <!-- Product Details Modal -->
    <div id="product-modal" class="fixed inset-0 z-[3000] bg-black/60 hidden items-center justify-center p-0 md:p-4 backdrop-blur-sm">
        <div class="bg-white w-full max-w-4xl h-full md:h-auto md:max-h-[90vh] md:rounded-3xl shadow-2xl overflow-hidden flex flex-col md:flex-row relative text-right">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 z-50 bg-white/80 w-10 h-10 rounded-full flex items-center justify-center shadow-lg hover:bg-white transition-all text-xl font-bold">✕</button>
            <div class="w-full md:w-1/2 h-80 md:h-auto bg-gray-100 relative group">
                <div id="modal-images" class="w-full h-full flex transition-transform duration-500">
                    <img id="modal-main-img" src="" class="w-full h-full object-contain" loading="lazy">
                </div>
                <div class="absolute inset-x-0 top-1/2 -translate-y-1/2 flex justify-between px-4 opacity-0 group-hover:opacity-100 transition-opacity">
                    <button onclick="prevImg()" class="bg-white/90 p-3 rounded-full shadow-md hover:bg-white">❮</button>
                    <button onclick="nextImg()" class="bg-white/90 p-3 rounded-full shadow-md hover:bg-white">❯</button>
                </div>
                <div class="absolute bottom-4 left-1/2 -translate-x-1/2 bg-black/60 text-white text-[10px] font-black px-3 py-1.5 rounded-full backdrop-blur-sm">
                    <span id="photo-index">1</span> / <span id="photo-total">1</span>
                </div>
            </div>
            <div class="w-full md:w-1/2 p-6 flex flex-col overflow-y-auto no-scrollbar">
                <div class="flex items-center gap-2 mb-4">
                    <span class="bg-blue-100 text-blue-600 text-[10px] font-black px-2 py-1 rounded-md">إعلان موثوق</span>
                    <span id="modal-time" class="text-[10px] text-gray-400 mr-auto"></span>
                </div>
                <h2 id="modal-title" class="text-xl font-black text-gray-800 mb-2 leading-tight"></h2>
                <p id="modal-price" class="text-2xl font-black text-blue-600 mb-6"></p>
                <div class="flex items-center gap-2 text-gray-500 text-sm mb-6 pb-6 border-b">
                    <span>📍</span><span id="modal-location"></span>
                </div>
                <div class="mb-6">
                    <h4 class="font-black text-sm mb-2">وصف المنتج:</h4>
                    <p id="modal-desc" class="text-sm text-gray-600 leading-relaxed"></p>
                </div>
                <div id="contact-methods-container" class="grid grid-cols-1 gap-3 mt-auto">
                    <button id="call-btn" class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-black text-sm shadow-lg hidden">📞 اتصـــــال</button>
                    <div id="secondary-btns" class="grid grid-cols-2 gap-3">
                        <button id="whatsapp-btn" class="bg-green-500 hover:bg-green-600 text-white py-4 rounded-2xl font-black text-sm hidden">💬 واتساب</button>
                        <button id="chat-btn" class="bg-gray-800 hover:bg-black text-white py-4 rounded-2xl font-black text-sm flex items-center justify-center">✉ دردشة</button>
                    </div>
                    <button id="share-whatsapp-btn" class="w-full bg-white border-2 border-green-500 text-green-600 hover:bg-green-50 py-3 rounded-2xl font-black text-sm flex items-center justify-center gap-2 transition-all">
                        <span class="text-lg">📢</span> شارك مع أصحابك على واتساب
                    </button>
                </div>
            </div>
        </div>
    </div>

    <header class="bg-white shadow-sm sticky top-0 z-[1000] border-b">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between gap-2 md:gap-3">
            <div class="flex items-center gap-2 md:gap-3 shrink-0">
                <div onclick="window.location.reload()" class="flex items-center gap-2 cursor-pointer">
                    <div class="logo-gradient text-white w-9 h-9 md:w-10 md:h-10 flex items-center justify-center rounded-xl font-black text-lg md:text-xl shadow-lg">ر</div>
                    <span class="text-lg md:text-xl font-black hidden lg:block">روبا<span class="text-blue-600">بيكيا</span></span>
                </div>
                <div onclick="toggleLocationModal()" class="flex items-center gap-1 cursor-pointer bg-gray-50 hover:bg-gray-100 px-2 md:px-3 py-1.5 md:py-2 rounded-xl border border-gray-100 transition-all shrink-0">
                    <span class="text-blue-600 text-xs md:text-sm">📍</span>
                    <span id="current-city-name" class="text-[9px] md:text-[10px] font-black text-gray-700 max-w-[60px] md:max-w-none truncate">كل مصر</span>
                </div>
            </div>
            <div class="flex flex-1 relative">
                <input type="text" id="search-input" placeholder="بتدور على إيه؟" class="w-full bg-gray-100 rounded-xl py-2 md:py-2.5 px-8 md:px-10 outline-none focus:ring-2 focus:ring-blue-500 text-[11px] md:text-sm border-none text-right">
                <div class="absolute right-2 md:right-3 top-1/2 -translate-y-1/2 text-gray-400 text-xs md:text-sm">🔍</div>
            </div>
            <div id="auth-section" class="hidden md:flex items-center gap-3 shrink-0">
                <a href="login.html" class="text-xs font-black text-gray-500 hover:text-blue-600 px-3 transition-colors">دخول</a>
                <a href="login.html" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-black text-xs shadow-md">+ بيع دلوقتي</a>
            </div>
        </div>
    </header>

    <nav class="bg-white border-b sticky top-[61px] md:top-[65px] z-[900]">
        <div class="container mx-auto px-4 overflow-hidden">
            <div class="no-scrollbar flex items-center justify-start md:justify-center gap-4 py-3 overflow-x-auto whitespace-nowrap">
                <button onclick="toggleSub('cars', this, 'السيارات')" class="cat-btn flex flex-col items-center p-2 min-w-[75px] rounded-2xl transition-all"><span class="text-xl">🚗</span><span class="text-[10px] font-bold mt-1">سيارات</span></button>
                <button onclick="toggleSub('real', this, 'العقارات')" class="cat-btn flex flex-col items-center p-2 min-w-[75px] rounded-2xl transition-all"><span class="text-xl">🏠</span><span class="text-[10px] font-bold mt-1">عقارات</span></button>
                <button onclick="toggleSub('elec', this, 'الإلكترونيات')" class="cat-btn flex flex-col items-center p-2 min-w-[75px] rounded-2xl transition-all"><span class="text-xl">📱</span><span class="text-[10px] font-bold mt-1">إلكترونيات</span></button>
                <button onclick="toggleSub('elec_appliances', this, 'الكهربائيات')" class="cat-btn flex flex-col items-center p-2 min-w-[75px] rounded-2xl transition-all"><span class="text-xl">⚡</span><span class="text-[10px] font-bold mt-1">كهربائيات</span></button>
                <button onclick="toggleSub('fashion', this, 'الملابس')" class="cat-btn flex flex-col items-center p-2 min-w-[75px] rounded-2xl transition-all"><span class="text-xl">👕</span><span class="text-[10px] font-bold mt-1">ملابس</span></button>
                <button onclick="toggleSub('home', this, 'الأثاث')" class="cat-btn flex flex-col items-center p-2 min-w-[75px] rounded-2xl transition-all"><span class="text-xl">🛋️</span><span class="text-[10px] font-bold mt-1">أثاث</span></button>
                <button onclick="toggleSub('services', this, 'الخدمات')" class="cat-btn flex flex-col items-center p-2 min-w-[75px] rounded-2xl transition-all"><span class="text-xl">🛠️</span><span class="text-[10px] font-bold mt-1">خدمات</span></button>
                <button onclick="toggleSub('jobs', this, 'الوظائف')" class="cat-btn flex flex-col items-center p-2 min-w-[75px] rounded-2xl transition-all"><span class="text-xl">💼</span><span class="text-[10px] font-bold mt-1">وظائف</span></button>
                <button onclick="toggleSub('animals', this, 'الحيوانات')" class="cat-btn flex flex-col items-center p-2 min-w-[75px] rounded-2xl transition-all"><span class="text-xl">🐶</span><span class="text-[10px] font-bold mt-1">حيوانات</span></button>
            </div>
        </div>
        <div id="sub-menu-bar" class="bg-blue-50 border-t border-blue-100"><div class="container mx-auto px-4 py-4"><div id="sub-content" class="flex flex-wrap gap-2 justify-center"></div></div></div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        <div id="ads-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 sm:gap-6"></div>
    </main>

    <!-- Mobile Nav -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t py-3 px-2 z-[2000] flex items-center justify-around shadow-lg">
        <a href="index.html" class="bottom-nav-item active flex flex-col items-center gap-1 text-blue-600"><span>🏠</span><span class="text-[9px] font-black">الرئيسية</span></a>
        <a href="favorites.html" class="bottom-nav-item flex flex-col items-center gap-1 text-gray-400"><span>❤</span><span class="text-[9px] font-black">المفضلة</span></a>
        <a href="add-ad.html" class="flex flex-col items-center -mt-8 bg-blue-600 text-white w-14 h-14 rounded-full border-4 border-gray-50 flex items-center justify-center shadow-lg active:scale-90 transition-all"><span class="text-2xl font-bold">+</span></a>
        <a href="messages.html" class="bottom-nav-item flex flex-col items-center gap-1 text-gray-400 relative">
            <span>💬<div id="msg-badge" class="hidden absolute -top-1.5 -right-2 bg-red-600 text-white text-[8px] font-bold px-1 py-0.5 rounded-full border border-white msg-badge">0</div></span>
            <span class="text-[9px] font-black">الرسائل</span>
        </a>
        <a href="my-ads.html" id="mobile-account-link" class="bottom-nav-item flex flex-col items-center gap-1 text-gray-400"><span>👤</span><span class="text-[9px] font-black">حسابي</span></a>
    </nav>

    <script type="module">
        import { supabase } from "./supabase-config.js";
        import { db, collection, query, where, onSnapshot } from "./firebase-config.js";

        let adsCache = [];
        let currentAdImages = [];
        let currentImgIndex = 0;
        let selectedLocation = localStorage.getItem('userLocation') || 'كل مصر';
        let activeCategory = 'all';
        let activeSubCategory = 'الكل';
        let searchTerm = '';

        const user = JSON.parse(localStorage.getItem('user'));
        document.getElementById('current-city-name').innerText = selectedLocation;

        async function fetchAds() {
            let qB = supabase.from('ads').select('*');
            if (selectedLocation !== 'كل مصر') qB = qB.eq('location', selectedLocation);
            if (activeCategory !== 'all') qB = qB.eq('main_category', activeCategory);
            if (activeSubCategory !== 'الكل') qB = qB.eq('sub_category', activeSubCategory);
            if (searchTerm) qB = qB.ilike('title', `%${searchTerm}%`);

            const { data, error } = await qB.order('created_at', { ascending: false });
            if (!error) { adsCache = data; renderAds(data); checkDirectLink(); }
        }

        function checkDirectLink() {
            const urlParams = new URLSearchParams(window.location.search);
            const adId = urlParams.get('ad');
            if (adId && adsCache.length > 0) {
                const ad = adsCache.find(a => a.id == adId);
                if (ad) openProductModal(ad.id);
                window.history.replaceState({}, '', window.location.pathname);
            }
        }

        function renderAds(ads) {
            const grid = document.getElementById('ads-grid');
            if (!ads || ads.length === 0) { grid.innerHTML = '<p class="col-span-full text-center py-20 text-gray-400 font-bold">لا توجد نتائج</p>'; return; }
            grid.innerHTML = ads.map(ad => {
                const img = getSafeImageUrl(ad.image_url);
                return `
                <div onclick="openProductModal(${ad.id})" class="ad-card bg-white rounded-2xl border border-gray-100 overflow-hidden flex flex-col shadow-sm text-right">
                    <div class="h-40 sm:h-48 bg-gray-200"><img src="${img}" class="w-full h-full object-cover" loading="lazy"></div>
                    <div class="p-3">
                        <h3 class="text-xs sm:text-sm font-bold text-gray-800 line-clamp-2 h-8 sm:h-10">${ad.title}</h3>
                        <p class="text-blue-600 font-black text-sm mt-1">${ad.price} ج.م</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.openProductModal = function(id) {
            const ad = adsCache.find(a => a.id === id);
            if (!ad) return;

            currentAdImages = [];
            try { currentAdImages = JSON.parse(ad.image_url); } catch(e) { currentAdImages = [ad.image_url]; }
            showImage(0);

            document.getElementById('modal-title').innerText = ad.title;
            document.getElementById('modal-price').innerText = ad.price + " ج.م";
            document.getElementById('modal-location').innerText = ad.location;
            document.getElementById('modal-desc').innerText = ad.description;

            const callBtn = document.getElementById('call-btn');
            const whatsappBtn = document.getElementById('whatsapp-btn');
            const chatBtn = document.getElementById('chat-btn');
            const secondaryBtns = document.getElementById('secondary-btns');

            if (ad.phone) {
                callBtn.classList.remove('hidden');
                callBtn.onclick = () => window.location.href = `tel:${ad.phone}`;
            } else { callBtn.classList.add('hidden'); }

            if (ad.whatsapp) {
                whatsappBtn.classList.remove('hidden');
                whatsappBtn.onclick = () => window.open(`https://wa.me/2${ad.whatsapp}`, '_blank');
            } else { whatsappBtn.classList.add('hidden'); }

            // الدردشة تظهر دائماً طالما لا يوجد عامود في قاعدة البيانات للتحكم بها
            chatBtn.classList.remove('hidden');
            chatBtn.onclick = () => {
                if (!user) { window.location.href = 'login.html'; return; }
                window.location.href = `messages.html?seller=${ad.seller_email.toLowerCase()}&adId=${ad.id}&ad=${encodeURIComponent(ad.title)}&img=${encodeURIComponent(getSafeImageUrl(ad.image_url))}&price=${ad.price}`;
            };

            if (whatsappBtn.classList.contains('hidden')) {
                secondaryBtns.classList.replace('grid-cols-2', 'grid-cols-1');
            } else {
                secondaryBtns.classList.replace('grid-cols-1', 'grid-cols-2');
            }

            document.getElementById('share-whatsapp-btn').onclick = () => {
                const url = `${window.location.origin}${window.location.pathname}?ad=${ad.id}`;
                const txt = `شوف الإعلان ده على روبابيكيا:\n*${ad.title}*\nالسعر: ${ad.price} ج.م\n📍 ${ad.location}\n\nالرابط:\n${url}`;
                window.open(`https://wa.me/?text=${encodeURIComponent(txt)}`, '_blank');
            };

            document.getElementById('product-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        };

        window.closeProductModal = () => { document.getElementById('product-modal').style.display = 'none'; document.body.style.overflow = 'auto'; };
        window.showImage = (idx) => {
            currentImgIndex = idx;
            document.getElementById('modal-main-img').src = currentAdImages[idx];
            document.getElementById('photo-index').innerText = idx + 1;
            document.getElementById('photo-total').innerText = currentAdImages.length;
        };
        window.nextImg = () => showImage((currentImgIndex + 1) % currentAdImages.length);
        window.prevImg = () => showImage((currentImgIndex - 1 + currentAdImages.length) % currentAdImages.length);

        function getSafeImageUrl(url) {
            if (!url) return "https://via.placeholder.com/400";
            try { const p = JSON.parse(url); return Array.isArray(p) ? p[0] : url; } catch(e) { return url; }
        }

        const egyptLocations = ["القاهرة - مدينة نصر", "القاهرة - التجمع الخامس", "القاهرة - مصر الجديدة", "القاهرة - المعادي", "القاهرة - الرحاب", "القاهرة - مدينتي", "الجيزة - 6 أكتوبر", "الجيزة - الشيخ زايد", "الجيزة - الهرم", "الجيزة - فيصل", "الجيزة - المهندسين", "الإسكندرية - سموحة", "الإسكندرية - ميامي", "الدقهلية - المنصورة", "الشرقية - الزقازيق", "الغربية - طنطا", "المنوفية - شبين الكوم", "البحيرة - دمنهور", "كفر الشيخ", "دمياط", "بور سعيد", "السويس", "الإسماعيلية", "الفيوم", "بني سويف", "المنيا", "أسيوط", "سوهاج", "قنا", "الأقصر", "أسوان", "الغردقة", "مرسى مطروح"];
        window.toggleLocationModal = () => {
            const m = document.getElementById('location-modal');
            m.classList.toggle('hidden'); m.classList.toggle('flex');
            if (!m.classList.contains('hidden')) renderLocationsUI(egyptLocations);
        };
        function renderLocationsUI(list) {
            document.getElementById('location-list').innerHTML = `<div onclick="selectLocation('كل مصر')" class="p-3 hover:bg-blue-50 rounded-xl cursor-pointer font-black text-sm text-blue-600 border-b border-gray-50">📍 كل مصر</div>` +
                list.map(l => `<div onclick="selectLocation('${l}')" class="p-3 hover:bg-blue-50 rounded-xl cursor-pointer font-bold text-sm border-b border-gray-50 last:border-0">📍 ${l}</div>`).join('');
        }
        window.filterLocationsUI = () => renderLocationsUI(egyptLocations.filter(l => l.toLowerCase().includes(document.getElementById('location-search-input').value.toLowerCase())));
        window.selectLocation = (l) => { selectedLocation = l; localStorage.setItem('userLocation', l); document.getElementById('current-city-name').innerText = l; toggleLocationModal(); fetchAds(); };

        document.getElementById('search-input').addEventListener('keypress', (e) => { if (e.key === 'Enter') { searchTerm = e.target.value; fetchAds(); } });

        const cats = { cars: ['سيارات مستعملة', 'سيارات جديدة', 'موتوسيكلات'], real: ['شراء', 'استئجار', 'أرض'], elec: ['موبايلات', 'حواسيب', 'لابتوب'], elec_appliances: ['ثلاجات', 'غسالات'], fashion: ['رجالي', 'نسائي'], home: ['غرف نوم', 'مطبخ'], services: ['صيانة', 'تنظيف'], jobs: ['توظيف', 'عمل حر'], animals: ['كلاب', 'قطط'] };
        window.toggleSub = (cat, btn, label) => {
            const bar = document.getElementById('sub-menu-bar'), content = document.getElementById('sub-content');
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
            if (activeCategory === cat) { activeCategory = 'all'; bar.classList.remove('active'); fetchAds(); return; }
            activeCategory = cat; btn.classList.add('active'); bar.classList.add('active');
            content.innerHTML = `<button onclick="filterBySub('${cat}', 'الكل')" class="bg-white border border-blue-200 text-blue-600 px-4 py-2 rounded-full text-xs font-bold shadow-sm">كل ${label}</button>` +
                cats[cat].map(s => `<button onclick="filterBySub('${cat}', '${s}')" class="bg-white border border-gray-100 text-gray-600 px-4 py-2 rounded-full text-xs font-bold shadow-sm">${s}</button>`).join('');
            fetchAds();
        };
        window.filterBySub = (cat, sub) => { activeSubCategory = sub; fetchAds(); };

        if (user) {
            document.getElementById('auth-section').innerHTML = `<a href="my-ads.html" class="text-xs font-black text-gray-500 hover:text-blue-600">إعلاناتي</a><a href="add-ad.html" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-black text-xs shadow-md">+ بيع دلوقتي</a>`;
            document.getElementById('mobile-account-link').href = 'my-ads.html';
        }
        fetchAds();
    </script>
</body>
</html>
