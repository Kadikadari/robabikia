<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>روبابيكيا - بيع واشتري أي حاجة في مصر</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; -webkit-tap-highlight-color: transparent; padding-bottom: 70px; }
        .logo-gradient { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); }
        .no-scrollbar::-webkit-scrollbar { display: none; }
        .no-scrollbar { -ms-overflow-style: none; scrollbar-width: none; }
        #sub-menu-bar { display: none; animation: slideDown 0.3s ease-out; }
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
        .cat-btn.active { color: #2563eb; background-color: #eff6ff; border-color: #2563eb; }
        #location-modal, #product-modal { display: none; backdrop-filter: blur(8px); }
        .ad-card { transition: all 0.2s ease; cursor: pointer; }
        @media (min-width: 768px) { .ad-card:hover { transform: translateY(-5px); box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1); } }
        #user-menu { display: none; }
        #user-menu.active { display: block !important; animation: fadeIn 0.2s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body class="bg-gray-50 text-gray-900">

    <!-- Product Details Modal -->
    <div id="product-modal" class="fixed inset-0 z-[3000] bg-black/60 hidden items-center justify-center sm:p-4 text-right">
        <div class="bg-white w-full max-w-4xl h-full sm:h-auto sm:max-h-[90vh] sm:rounded-3xl shadow-2xl overflow-y-auto no-scrollbar relative animate-in slide-in-from-bottom duration-300">
            <button onclick="closeProductModal()" class="absolute top-4 right-4 z-10 bg-white/80 backdrop-blur w-10 h-10 rounded-full flex items-center justify-center shadow-lg font-bold">✕</button>
            <div class="flex flex-col md:flex-row">
                <div class="w-full md:w-1/2 bg-gray-100 flex items-center justify-center">
                    <img id="modal-img" src="" class="w-full h-full object-contain max-h-[500px]">
                </div>
                <div class="w-full md:w-1/2 p-6 flex flex-col">
                    <div class="flex items-center gap-2 mb-4"><span class="bg-blue-100 text-blue-600 text-[10px] font-black px-2 py-1 rounded-md">إعلان موثوق</span><span id="modal-time" class="text-[10px] text-gray-400 mr-auto"></span></div>
                    <h2 id="modal-title" class="text-xl font-black text-gray-800 mb-2 leading-tight"></h2>
                    <p id="modal-price" class="text-2xl font-black text-blue-600 mb-6"></p>
                    <div class="flex items-center gap-2 text-gray-500 text-sm mb-6 pb-6 border-b"><span>📍</span><span id="modal-location"></span></div>
                    <div class="mb-6"><h4 class="font-black text-sm mb-2">وصف المنتج:</h4><p id="modal-desc" class="text-sm text-gray-600 leading-relaxed"></p></div>
                    <div class="grid grid-cols-1 gap-3 mt-auto">
                        <button class="w-full bg-blue-600 hover:bg-blue-700 text-white py-4 rounded-2xl font-black text-sm shadow-lg">📞 اتصـــــال</button>
                        <div class="grid grid-cols-2 gap-3">
                            <button class="bg-green-500 hover:bg-green-600 text-white py-4 rounded-2xl font-black text-sm">💬 واتساب</button>
                            <button id="chat-btn" class="bg-gray-800 hover:bg-black text-white py-4 rounded-2xl font-black text-sm flex items-center justify-center">✉ دردشة</button>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Location Modal -->
    <div id="location-modal" class="fixed inset-0 z-[2000] bg-black/40 hidden items-center justify-center p-4">
        <div class="bg-white w-full max-w-md rounded-3xl shadow-2xl overflow-hidden text-right">
            <div class="p-5 border-b flex justify-between items-center bg-gray-50">
                <h3 class="font-black text-lg text-gray-800">تحديد الموقع</h3>
                <button onclick="toggleLocationModal()" class="text-gray-400 text-xl font-bold">✕</button>
            </div>
            <div class="p-4">
                <div id="location-list" class="max-h-[350px] overflow-y-auto space-y-1 no-scrollbar text-right"></div>
            </div>
        </div>
    </div>

    <!-- Header -->
    <header class="bg-white shadow-sm sticky top-0 z-[1000] border-b">
        <div class="container mx-auto px-4 py-3 flex items-center justify-between gap-3">
            <div onclick="window.location.reload()" class="flex items-center gap-2 cursor-pointer shrink-0">
                <div class="logo-gradient text-white w-10 h-10 flex items-center justify-center rounded-xl font-black text-xl shadow-lg">ر</div>
                <span class="text-xl font-black hidden md:block">روبا<span class="text-blue-600">بيكيا</span></span>
            </div>
            <button onclick="toggleLocationModal()" class="flex items-center gap-2 bg-gray-100 px-3 py-2.5 rounded-xl border border-transparent shrink-0"><span class="text-blue-600">📍</span><span id="current-location" class="text-xs font-black truncate max-w-[100px]">كل مصر</span></button>
            <div class="hidden lg:flex flex-1 relative max-w-xl text-right"><input type="text" id="search-input" placeholder="بتدور على إيه؟" class="w-full bg-gray-100 rounded-xl py-2.5 px-10 outline-none focus:ring-2 focus:ring-blue-500 text-sm border-none text-right"><div class="absolute right-3 top-1/2 -translate-y-1/2 text-gray-400">🔍</div></div>
            <div id="auth-section" class="flex items-center gap-3">
                <a href="login.html" class="text-xs font-black text-gray-500 hover:text-blue-600 px-3 transition-colors">دخول</a>
                <a href="login.html" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-black text-xs shadow-md">+ بيع دلوقتي</a>
            </div>
        </div>
    </header>

    <!-- Navigation -->
    <nav class="bg-white border-b sticky top-[65px] z-[900]">
        <div class="container mx-auto px-4 overflow-hidden">
            <div class="no-scrollbar flex items-center justify-start md:justify-center gap-4 py-3 overflow-x-auto whitespace-nowrap text-right">
                <button onclick="toggleSub('cars', this, 'السيارات')" class="cat-btn flex flex-col items-center p-2 min-w-[75px] rounded-2xl transition-all"><span class="text-xl">🚗</span><span class="text-[10px] font-bold mt-1">سيارات</span></button>
                <button onclick="toggleSub('real', this, 'العقارات')" class="cat-btn flex flex-col items-center p-2 min-w-[75px] rounded-2xl transition-all"><span class="text-xl">🏠</span><span class="text-[10px] font-bold mt-1">عقارات</span></button>
                <button onclick="toggleSub('elec', this, 'الإلكترونيات')" class="cat-btn flex flex-col items-center p-2 min-w-[75px] rounded-2xl transition-all"><span class="text-xl">📱</span><span class="text-[10px] font-bold mt-1">إلكترونيات</span></button>
                <button onclick="toggleSub('elec_appliances', this, 'الكهربائيات')" class="cat-btn flex flex-col items-center p-2 min-w-[75px] rounded-2xl transition-all"><span class="text-xl">⚡</span><span class="text-[10px] font-bold mt-1">كهربائيات</span></button>
                <button onclick="toggleSub('fashion', this, 'الملابس')" class="cat-btn flex flex-col items-center p-2 min-w-[75px] rounded-2xl transition-all"><span class="text-xl">👕</span><span class="text-[10px] font-bold mt-1">ملابس</span></button>
                <button onclick="toggleSub('home', this, 'الأثاث')" class="cat-btn flex flex-col items-center p-2 min-w-[75px] rounded-2xl transition-all"><span class="text-xl">🛋️</span><span class="text-[10px] font-bold mt-1">أثاث</span></button>
                <button onclick="toggleSub('animals', this, 'الحيوانات')" class="cat-btn flex flex-col items-center p-2 min-w-[75px] rounded-2xl transition-all"><span class="text-xl">🐶</span><span class="text-[10px] font-bold mt-1">حيوانات</span></button>
            </div>
        </div>
        <div id="sub-menu-bar" class="bg-blue-50 border-t border-blue-100"><div class="container mx-auto px-4 py-4"><div id="sub-content" class="flex flex-wrap gap-2 justify-center"></div></div></div>
    </nav>

    <main class="container mx-auto px-4 py-8">
        <div id="ads-grid" class="grid grid-cols-2 md:grid-cols-3 lg:grid-cols-5 gap-3 sm:gap-6 text-right">
            <div class="col-span-full py-20 text-center text-gray-400 font-bold italic">جاري تحميل أحدث الإعلانات...</div>
        </div>
    </main>

    <!-- Mobile Nav -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t py-3 px-2 z-[2000] flex items-center justify-around shadow-lg">
        <a href="index.html" class="bottom-nav-item active flex flex-col items-center gap-1 text-blue-600"><span>🏠</span><span class="text-[9px] font-black">الرئيسية</span></a>
        <a href="favorites.html" class="bottom-nav-item flex flex-col items-center gap-1 text-gray-400"><span>❤</span><span class="text-[9px] font-black">المفضلة</span></a>
        <a href="add-ad.html" class="flex flex-col items-center -mt-8 bg-blue-600 text-white w-14 h-14 rounded-full border-4 border-gray-50 flex items-center justify-center shadow-lg active:scale-90 transition-all"><span class="text-2xl font-bold">+</span></a>
        <a href="messages.html" class="bottom-nav-item flex flex-col items-center gap-1 text-gray-400"><span>💬</span><span class="text-[9px] font-black">الرسائل</span></a>
        <a href="login.html" id="mobile-account-link" class="bottom-nav-item flex flex-col items-center gap-1 text-gray-400"><span>👤</span><span class="text-[9px] font-black">حسابي</span></a>
    </nav>

    <script type="module">
        import { supabase } from "./supabase-config.js";

        let adsCache = [];

        async function fetchAds() {
            try {
                const { data, error } = await supabase.from('ads').select('*').order('created_at', { ascending: false });
                if (error) throw error;
                adsCache = data;
                renderAds(data);
            } catch (err) { console.error(err); }
        }

        function getSafeImageUrl(url) {
            let defaultImg = "https://via.placeholder.com/400x300?text=Robabikia";
            if (!url) return defaultImg;
            try {
                if (url.startsWith('[') || url.startsWith('{')) {
                    const parsed = JSON.parse(url);
                    if (Array.isArray(parsed) && parsed.length > 0) return parsed[0];
                    if (typeof parsed === 'string') return parsed;
                }
                return url;
            } catch (e) { return url; }
        }

        function renderAds(ads) {
            const grid = document.getElementById('ads-grid');
            if (!ads || ads.length === 0) { grid.innerHTML = '<p class="col-span-full text-center py-20 text-gray-400">لا توجد إعلانات حالياً</p>'; return; }
            grid.innerHTML = ads.map(ad => {
                const img = getSafeImageUrl(ad.image_url);
                return `
                <div onclick="openProductModal(${ad.id})" class="ad-card bg-white rounded-2xl border border-gray-100 overflow-hidden flex flex-col shadow-sm">
                    <div class="h-40 sm:h-48 bg-gray-200">
                        <img src="${img}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400x300?text=No+Image'">
                    </div>
                    <div class="p-3 text-right">
                        <h3 class="text-xs sm:text-sm font-bold text-gray-800 line-clamp-2 h-8 sm:h-10">${ad.title}</h3>
                        <p class="text-blue-600 font-black text-sm mt-1">${ad.price} ج.م</p>
                    </div>
                </div>`;
            }).join('');
        }

        window.openProductModal = function(id) {
            const ad = adsCache.find(a => a.id === id);
            if (!ad) return;
            document.getElementById('modal-title').innerText = ad.title;
            document.getElementById('modal-price').innerText = ad.price + " ج.م";
            document.getElementById('modal-location').innerText = ad.location;
            document.getElementById('modal-desc').innerText = ad.description;
            document.getElementById('modal-img').src = getSafeImageUrl(ad.image_url);

            // برمجة زر الدردشة
            document.getElementById('chat-btn').onclick = () => {
                const user = JSON.parse(localStorage.getItem('user'));
                if (!user) { window.location.href = 'login.html'; return; }
                if (user.email === ad.seller_email) { alert("هذا إعلانك الخاص!"); return; }
                window.location.href = `messages.html?seller=${ad.seller_email}&ad=${encodeURIComponent(ad.title)}`;
            };

            document.getElementById('product-modal').style.display = 'flex';
            document.body.style.overflow = 'hidden';
        }

        window.closeProductModal = function() { document.getElementById('product-modal').style.display = 'none'; document.body.style.overflow = 'auto'; }
        window.toggleLocationModal = function() { const m = document.getElementById('location-modal'); m.style.display = (m.style.display === 'flex' ? 'none' : 'flex'); }
        window.logout = function() { localStorage.removeItem('user'); window.location.reload(); }

        const subData = {
            'real': ['شراء', 'استئجار', 'أرض', 'شاليهات', 'فيلة'],
            'elec': ['موبايلات وهواتف', 'حواسيب', 'لابتوب', 'اجهزة اخرى'],
            'elec_appliances': ['كهربائيات المطبخ', 'تلفزيون', 'ثلاجه', 'غسالة', 'تكييف', 'اجهزة اخرى'],
            'fashion': ['رجالي', 'نسائي', 'أطفال', 'أحذية', 'ساعات وإكسسوارات', 'مكياج'],
            'cars': ['سيارات مستعملة', 'سيارات جديدة', 'موتوسيكلات', 'قطع غيار'],
            'home': ['صالون', 'مطبخ', 'غرفة نوم', 'حديقة'],
            'animals': ['كلاب', 'قطط', 'طيور', 'خيول', 'أسماك', 'أخرى']
        };

        window.toggleSub = function(key, btn, name) {
            const bar = document.getElementById('sub-menu-bar');
            const content = document.getElementById('sub-content');
            if (window.lastKey === key) { bar.style.display = 'none'; btn.classList.remove('active'); window.lastKey = ''; return; }
            document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active')); btn.classList.add('active');
            content.innerHTML = `<a href="#" class="bg-blue-600 text-white px-4 py-2 rounded-xl text-[11px] font-bold shadow-md">الكل في ${name}</a>` + subData[key].map(opt => `<a href="#" class="bg-white px-4 py-2 rounded-xl text-[11px] font-bold text-gray-700 shadow-sm border border-gray-100 hover:border-blue-500 transition-all">${opt}</a>`).join('');
            bar.style.display = 'block'; window.lastKey = key;
        }

        window.onload = () => {
            fetchAds();
            const user = JSON.parse(localStorage.getItem('user'));
            if (user) {
                const displayName = user.name || user.email || "؟";
                document.getElementById('auth-section').innerHTML = `
                    <div class="user-container relative flex items-center gap-3 cursor-pointer group">
                        <div onclick="document.getElementById('user-menu').classList.toggle('active')" class="w-10 h-10 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center font-black text-lg border-2 border-white shadow-sm">
                            ${displayName.charAt(0).toUpperCase()}
                        </div>
                        <div id="user-menu" class="absolute top-12 left-0 bg-white border border-gray-100 rounded-2xl p-2 min-w-[160px] shadow-xl z-[2000] text-right" style="display:none;">
                            <a href="messages.html" class="block px-4 py-2 text-xs font-bold text-gray-600 hover:bg-blue-50 rounded-lg">💬 الرسائل</a>
                            <a href="my-ads.html" class="block px-4 py-2 text-xs font-bold text-gray-600 hover:bg-blue-50 rounded-lg">📦 إعلاناتي</a>
                            <hr class="my-1 border-gray-50">
                            <button onclick="logout()" class="w-full text-right px-4 py-2 text-xs font-bold text-red-500 hover:bg-red-50 rounded-lg">🚪 خروج</button>
                        </div>
                        <a href="add-ad.html" class="bg-blue-600 text-white px-5 py-2.5 rounded-xl font-black text-xs shadow-md active:scale-95 transition-all">+ بيع دلوقتي</a>
                    </div>`;
                const mobileAccountLink = document.getElementById('mobile-account-link');
                if (mobileAccountLink) mobileAccountLink.href = 'my-ads.html';
            }
        };

        window.onclick = (e) => {
            if (e.target.id == 'product-modal') closeProductModal();
            if (e.target.id == 'location-modal') toggleLocationModal();
            const userMenu = document.getElementById('user-menu');
            if (userMenu && !e.target.closest('.user-container')) { userMenu.classList.remove('active'); }
        };
    </script>
</body>
</html>
