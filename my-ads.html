<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعلاناتي - روبابيكيا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; padding-bottom: 80px; }
        .logo-gradient { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); }
    </style>
</head>
<body class="text-right">

    <!-- Header -->
    <header class="bg-white p-4 border-b shadow-sm sticky top-0 z-50">
        <div class="container mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2">
                <div class="logo-gradient text-white w-9 h-9 flex items-center justify-center rounded-xl font-black text-lg">ر</div>
                <span class="text-xl font-black tracking-tighter text-gray-900">روبا<span class="text-blue-600">بيكيا</span></span>
            </a>
            <h1 class="text-lg font-black text-gray-800">إعلاناتي</h1>
            <div id="user-avatar" class="w-9 h-9 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center font-black text-xs border-2 border-white">؟</div>
        </div>
    </header>

    <main class="container mx-auto p-4 py-8">
        <div id="my-ads-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="col-span-full py-20 text-center text-gray-400 font-bold italic">جاري تحميل إعلاناتك...</div>
        </div>
    </main>

    <script type="module">
        import { supabase } from "./supabase-config.js";

        const user = JSON.parse(localStorage.getItem('user'));
        if (!user) window.location.href = 'login.html';

        document.getElementById('user-avatar').innerText = user.name.charAt(0).toUpperCase();

        async function fetchMyAds() {
            try {
                const { data, error } = await supabase
                    .from('ads')
                    .select('*')
                    .eq('seller_email', user.email)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                renderMyAds(data);
            } catch (err) {
                console.error(err);
                document.getElementById('my-ads-grid').innerHTML = '<p class="col-span-full text-center text-red-500">حدث خطأ في التحميل</p>';
            }
        }

        function renderMyAds(ads) {
            const grid = document.getElementById('my-ads-grid');
            if (ads.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-20 text-center"><p class="text-gray-400 font-bold">لم تقم بنشر أي إعلانات بعد</p><a href="add-ad.html" class="text-blue-600 underline mt-2 block">انشر إعلانك الأول الآن</a></div>';
                return;
            }
            grid.innerHTML = ads.map(ad => `
                <div class="bg-white rounded-3xl border border-gray-100 overflow-hidden shadow-sm flex flex-col">
                    <div class="h-40 bg-gray-100 relative">
                        <img src="${ad.image_url || 'https://via.placeholder.com/400x300?text=Robabikia'}" class="w-full h-full object-cover">
                    </div>
                    <div class="p-4">
                        <h3 class="font-bold text-gray-800 text-sm mb-2 truncate">${ad.title}</h3>
                        <p class="text-blue-600 font-black mb-4">${ad.price} ج.م</p>
                        <div class="grid grid-cols-2 gap-2 pt-4 border-t border-gray-50">
                            <button onclick="editAd(${ad.id})" class="bg-gray-100 text-gray-600 py-2 rounded-xl text-xs font-black hover:bg-blue-50 hover:text-blue-600 transition-all flex items-center justify-center gap-1">✏️ تعديل</button>
                            <button onclick="deleteAd(${ad.id})" class="bg-red-50 text-red-500 py-2 rounded-xl text-xs font-black hover:bg-red-500 hover:text-white transition-all flex items-center justify-center gap-1">🗑️ حذف</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.deleteAd = async (id) => {
            if (confirm('هل أنت متأكد من حذف هذا الإعلان نهائياً؟')) {
                const { error } = await supabase.from('ads').delete().eq('id', id);
                if (error) alert('خطأ في الحذف');
                else fetchMyAds();
            }
        };

        window.editAd = (id) => {
            alert('قريباً: سيتم فتح صفحة التعديل للإعلان رقم ' + id);
        };

        fetchMyAds();
    </script>
</body>
</html>
