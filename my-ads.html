<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إعلاناتي - روبابيكيا</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; padding-bottom: 80px; }
        .logo-gradient { background: linear-gradient(135deg, #2563eb 0%, #1e40af 100%); }
    </style>
</head>
<body class="text-right">

    <!-- Header -->
    <header class="bg-white p-4 border-b shadow-sm sticky top-0 z-50">
        <div class="container mx-auto flex items-center justify-between">
            <a href="index.html" class="flex items-center gap-2 text-right">
                <div class="logo-gradient text-white w-9 h-9 flex items-center justify-center rounded-xl font-black text-lg">ر</div>
                <span class="text-xl font-black tracking-tighter text-gray-900">روبا<span class="text-blue-600">بيكيا</span></span>
            </a>
            <h1 class="text-lg font-black text-gray-800">إعلاناتي</h1>
            <div id="user-avatar" class="w-9 h-9 bg-orange-100 text-orange-600 rounded-full flex items-center justify-center font-black text-xs border-2 border-white">؟</div>
        </div>
    </header>

    <main class="container mx-auto p-4 py-8">
        <div id="my-ads-grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-6">
            <div class="col-span-full py-20 text-center text-gray-400 font-bold italic">جاري تحميل إعلاناتك...</div>
        </div>
    </main>

    <!-- Mobile Nav -->
    <nav class="md:hidden fixed bottom-0 left-0 right-0 bg-white border-t py-3 px-2 z-[2000] flex items-center justify-around shadow-lg">
        <a href="index.html" class="flex flex-col items-center gap-1 text-gray-400"><span>🏠</span><span class="text-[9px] font-black">الرئيسية</span></a>
        <a href="favorites.html" class="flex flex-col items-center gap-1 text-gray-400"><span>❤</span><span class="text-[9px] font-black">المفضلة</span></a>
        <a href="add-ad.html" class="flex flex-col items-center -mt-8 bg-blue-600 text-white w-14 h-14 rounded-full border-4 border-gray-50 flex items-center justify-center shadow-lg active:scale-90 transition-all"><span class="text-2xl font-bold">+</span></a>
        <a href="messages.html" class="flex flex-col items-center gap-1 text-gray-400"><span>💬</span><span class="text-[9px] font-black">الرسائل</span></a>
        <a href="my-ads.html" class="flex flex-col items-center gap-1 text-blue-600"><span>📦</span><span class="text-[9px] font-black">إعلاناتي</span></a>
    </nav>

    <script type="module">
        import { supabase } from "./supabase-config.js";

        const user = JSON.parse(localStorage.getItem('user'));

        if (!user || !user.email) {
            window.location.href = 'login.html';
        } else {
            document.getElementById('user-avatar').innerText = (user.name || user.email).charAt(0).toUpperCase();
            fetchMyAds();
        }

        async function fetchMyAds() {
            try {
                console.log("Fetching ads for email:", user.email);
                const { data, error } = await supabase
                    .from('ads')
                    .select('*')
                    .eq('seller_email', user.email)
                    .order('created_at', { ascending: false });

                if (error) throw error;
                console.log("Ads found:", data);
                renderMyAds(data);
            } catch (err) {
                console.error("Supabase error:", err);
                document.getElementById('my-ads-grid').innerHTML = `<p class="col-span-full text-center text-red-500">حدث خطأ في تحميل البيانات: ${err.message}</p>`;
            }
        }

        function renderMyAds(ads) {
            const grid = document.getElementById('my-ads-grid');
            if (!ads || ads.length === 0) {
                grid.innerHTML = '<div class="col-span-full py-20 text-center"><p class="text-gray-400 font-bold text-lg">لم تقم بنشر أي إعلانات بعد</p><a href="add-ad.html" class="bg-blue-600 text-white px-6 py-3 rounded-2xl font-black mt-4 inline-block shadow-lg">انشر إعلانك الأول الآن</a></div>';
                return;
            }
            grid.innerHTML = ads.map(ad => {
                let img = "https://via.placeholder.com/400x300?text=Robabikia";
                try {
                    if (ad.image_url) {
                        if (ad.image_url.startsWith('[') || ad.image_url.startsWith('{')) {
                            const imgs = JSON.parse(ad.image_url);
                            if (Array.isArray(imgs) && imgs.length > 0) img = imgs[0];
                            else if (typeof imgs === 'string') img = imgs;
                        } else {
                            img = ad.image_url;
                        }
                    }
                } catch(e) {
                    console.warn("Error parsing image_url for ad:", ad.id, e);
                    if(ad.image_url) img = ad.image_url;
                }

                return `
                <div class="bg-white rounded-3xl border border-gray-100 overflow-hidden shadow-sm flex flex-col group transition-all hover:shadow-md text-right">
                    <div class="h-44 bg-gray-100 relative">
                        <img src="${img}" class="w-full h-full object-cover" onerror="this.src='https://via.placeholder.com/400x300?text=Image+Error'">
                        <div class="absolute top-2 left-2 bg-white/90 backdrop-blur px-2 py-1 rounded-lg text-[9px] font-black text-blue-600 shadow-sm">${ad.main_category || 'عام'}</div>
                    </div>
                    <div class="p-4 flex flex-col flex-1">
                        <h3 class="font-black text-gray-800 text-sm mb-1 truncate text-right">${ad.title}</h3>
                        <p class="text-blue-600 font-black text-lg mb-4 text-right">${ad.price} ج.م</p>
                        <div class="grid grid-cols-2 gap-2 mt-auto pt-4 border-t border-gray-50">
                            <button onclick="editAd(${ad.id})" class="bg-blue-50 text-blue-600 py-3 rounded-xl text-xs font-black hover:bg-blue-600 hover:text-white transition-all flex items-center justify-center gap-1">✏️ تعديل</button>
                            <button onclick="deleteAd(${ad.id})" class="bg-red-50 text-red-500 py-3 rounded-xl text-xs font-black hover:bg-red-500 hover:text-white transition-all flex items-center justify-center gap-1">🗑️ حذف</button>
                        </div>
                    </div>
                </div>
            `).join('');
        }

        window.deleteAd = async (id) => {
            if (confirm('هل أنت متأكد من حذف هذا الإعلان نهائياً؟ لا يمكن التراجع عن هذا القرار.')) {
                try {
                    const { error } = await supabase.from('ads').delete().eq('id', id);
                    if (error) throw error;
                    fetchMyAds();
                } catch (err) {
                    alert('خطأ في الحذف: ' + err.message);
                }
            }
        };

        window.editAd = (id) => {
            alert('قريباً: سيتم فتح واجهة تعديل الإعلان رقم ' + id);
        };
    </script>
</body>
</html>
